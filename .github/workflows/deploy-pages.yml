name: Deploy GitHub Pages

# GitHub Pages 로 나가는 길은 이 파일 하나다.
#
# 예전에는 배포 워크플로가 셋이었다(deploy-pages · -emergency · -recovery).
# 셋이 같은 github-pages 환경에 배포하는데 concurrency 그룹이 서로 달라
# 상대를 취소하지 못했다. 그래서 같은 커밋이 두 번씩 배포되고, 큐가 20분씩
# 밀리고, 최근 실행 30건 중 취소 6 · 실패 3 · startup_failure 5 가 났다.
# 그 사이 사이트는 main 보다 일곱 커밋 뒤처져 있었다.
#
# 규칙은 둘이다.
#   1. 배포하는 워크플로는 하나뿐이고, concurrency 그룹도 하나다.
#   2. **건너뛰는 길을 만들지 않는다.** 실행이 시작됐으면 반드시 배포로 끝난다.
#
# 2번이 중요하다. 앞 판본은 "내가 최신 main 이 아니면 건너뛴다" 는 관문을
# 두었는데, 그러면 마지막 실행 하나가 실패하거나 취소되는 순간 **아무도
# 배포하지 않은 채 조용히 낡은 사이트가 남는다.** 다음 push 가 있을 때까지
# 아무도 모른다. 대신 여기서는 트리거한 커밋이 아니라 **빌드 시점의 최신
# main** 을 체크아웃한다. 연속 push 가 몰리면 concurrency 가 낡은 실행을
# 취소하고, 살아남은 하나가 어차피 최신 main 을 배포한다. 결과는 같고
# 조용히 실패할 자리는 없다.
#
# 최신 SHA 를 확인하려고 따로 두었던 준비 작업(job)도 없앴다. 러너 하나를
# 통째로 잡아 API 한 번 부르는 일인데, 이 저장소의 병목이 바로 러너 대기
# 시간이라 오히려 지연을 키웠다.

on:
  push:
    branches: [main]
  workflow_dispatch:

# 한 번에 하나만 나간다. 연속 push 는 최신 실행만 남기고 취소한다.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 트리거한 커밋이 아니라 지금 시점의 main 을 받는다. 위 머리말 참고.
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve built commit
        id: built
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "빌드 대상 커밋: ${sha}"
          if [ "${sha}" != "${GITHUB_SHA}" ]; then
            echo "트리거 커밋(${GITHUB_SHA}) 이후 main 이 더 진행됐다. 최신 것으로 배포한다."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # 무엇이 살아 있는지 사이트 자신이 말하게 한다.
      #
      # public/version.json 은 손으로 적는 파일이라 반드시 낡는다. 실제로
      # sourceCommit 이 16ae5629 에 박힌 채 그 뒤로 16커밋이 쌓여 있었고,
      # 지금 무엇이 배포돼 있는지 확인할 길이 없었다. 빌드가 스스로 찍으면
      # 어긋날 수 없다. dist 에만 쓰므로 저장소 파일은 건드리지 않는다.
      - name: Stamp deployed commit into dist/version.json
        env:
          BUILT_SHA: ${{ steps.built.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const base = JSON.parse(fs.readFileSync("public/version.json", "utf8"));
            const stamped = {
              ...base,
              sourceCommit: process.env.BUILT_SHA,
              deployedAt: new Date().toISOString(),
              runId: process.env.RUN_ID,
            };
            fs.writeFileSync("dist/version.json", JSON.stringify(stamped, null, 2) + "\n");
            console.log(stamped);
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
