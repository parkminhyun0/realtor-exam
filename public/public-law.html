<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>부동산공법 핵심정리</title>
<style>
  body{margin:0;font-family:Inter,Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:transparent;color:#172033;font-size:12pt;line-height:1.6}
  strong{font-size:14pt}
</style>
</head>
<body>
<strong>부동산공법 내용을 불러오는 중입니다…</strong>
<script>
(async()=>{
  const embedded=new URLSearchParams(window.location.search).get('embed')==='1'
  if(!embedded){
    window.location.replace('./#/public-law')
    return
  }

  try{
    const files=Array.from({length:11},(_,i)=>`public-law-p${String(i+1).padStart(2,'0')}.dat`)
    const parts=await Promise.all(files.map(async(file)=>{
      const response=await fetch(file,{cache:'no-store'})
      if(!response.ok) throw new Error(`${file}: ${response.status}`)
      return response.text()
    }))
    const base64=parts.join('').replace(/\s+/g,'')
    const binary=atob(base64)
    const bytes=Uint8Array.from(binary,char=>char.charCodeAt(0))
    if(typeof DecompressionStream==='undefined') throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다.')
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))
    let html=await new Response(stream).text()

    const override=`<style id="registration-page-theme">
:root{
  --app-font-base:12pt;
  --app-font-important:14pt;
  --ink:#172033;
  --muted:#697386;
  --line:#dde3ea;
  --surface:#ffffff;
  --soft:#f7f8fa;
  --navy:#14223a;
  --gold:#b9852b;
  --gold-soft:#fbf3e4;
  --green:#1f7a65;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:transparent!important}
body{margin:0!important;padding:0!important;background:transparent!important;color:var(--ink)!important;font-family:Inter,Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
body,body *{font-size:var(--app-font-base)!important}
body h1,body h2,body h3,body h4,body h5,body h6,
body button,body summary,body .t,body .deep-title,body .tldr b{
  font-size:var(--app-font-important)!important
}
button,summary,[role="button"]{min-height:44px}
img,svg,video,canvas{max-width:100%;height:auto}
.hero,nav.toc,.view-indicator,.ch-head,h3.sec{display:none!important}
.wrap{display:block!important;min-height:0!important;background:transparent!important}
main{width:100%!important;min-width:0!important;max-width:none!important;margin:0!important;padding:0!important;background:transparent!important;color:var(--ink)!important}
section.ch{margin:0!important;padding:0!important;background:transparent!important}
.card,.section-deep,.inline-proc,.proc-table,.quiz,.box,.callout{
  max-width:100%!important;
  margin:0 0 16px!important;
  padding:20px!important;
  border:1px solid var(--line)!important;
  border-radius:16px!important;
  background:var(--surface)!important;
  box-shadow:none!important;
  color:var(--ink)!important;
}
.card h4,.section-deep h4,.inline-proc h4{margin-top:0!important;color:#22344c!important}
.tldr{
  margin:0 0 18px!important;
  padding:18px 20px!important;
  border:0!important;
  border-radius:14px!important;
  background:#16263e!important;
  color:#fff!important;
  box-shadow:none!important;
}
.tldr,.tldr *{color:#fff!important}
.tldr b{color:#ffd86b!important}
.section-deep{border-top:4px solid #2e5e8c!important;background:linear-gradient(180deg,#f8fafc 0%,#fff 110px)!important}
.section-deep .deep-grid,.two{gap:10px!important}
.section-deep .deep-grid>*,.two>*{
  border:1px solid #e6ebf1!important;
  border-radius:12px!important;
  padding:13px!important;
  background:#f8fafc!important;
}
table{width:100%!important;border-collapse:collapse!important;background:#fff!important;color:var(--ink)!important}
th,td{border:1px solid var(--line)!important;padding:9px 10px!important;vertical-align:top!important;text-align:left!important;overflow-wrap:break-word!important}
thead th{background:#eef2f7!important;color:#24344d!important;white-space:nowrap!important}
tbody th{background:#f8fafc!important;color:#263950!important}
.inline-proc .step,.proc-step{
  border:1.5px solid #cbd7e4!important;
  border-radius:12px!important;
  padding:12px!important;
  background:#f9fbfe!important;
  color:var(--ink)!important;
}
.inline-proc .arr,.proc-arrow{color:#8390a0!important}
.proc-tip,.note,.study-note{
  border:1px solid #d8e4f0!important;
  border-radius:10px!important;
  background:#eef4fb!important;
  color:#344e70!important;
}
.tag,.badge,.pill{
  border:1px solid #e0c995!important;
  border-radius:999px!important;
  background:var(--gold-soft)!important;
  color:#76551d!important;
}
details.quiz,details.card{overflow:hidden!important}
details summary{cursor:pointer!important;font-weight:900!important}
@media(max-width:900px){
  .card,.section-deep,.inline-proc,.proc-table{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:700px}
  .two,.section-deep .deep-grid{grid-template-columns:1fr!important}
}
@media(max-width:560px){
  .card,.section-deep,.inline-proc{padding:14px!important;border-radius:14px!important}
  .tldr{padding:15px!important}
  .proc-flow{flex-direction:column!important}
  .inline-proc .step{min-width:100%!important;flex-basis:auto!important}
  .inline-proc .arr{transform:rotate(90deg);align-self:center!important}
}
</style>`

    const bridge='<script id="public-law-embed-bridge">'+
      '(()=>{const send=()=>{const h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);parent.postMessage({type:"public-law:height",height:h},location.origin)};window.addEventListener("load",()=>{send();setTimeout(send,120);setTimeout(send,500)});window.addEventListener("click",()=>setTimeout(send,80),true);if(window.ResizeObserver){new ResizeObserver(send).observe(document.documentElement)}})();'+
      '<'+'/script>'

    html=html.replace(/<span>글자크기 11pt 통일<\/span>/,'<span>글자크기: 본문 12pt · 중요 텍스트 14pt</span>')
    html=html.replace('</head>',`${override}</head>`)
    html=html.replace('</body>',`${bridge}</body>`)
    document.open()
    document.write(html)
    document.close()
  }catch(error){
    document.body.innerHTML=`<strong>공법 내용을 불러오지 못했습니다.</strong><p>${String(error)}</p>`
  }
})()
</script>
</body>
</html>
