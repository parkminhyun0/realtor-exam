<body>
<strong>부동산공법 내용을 불러오는 중입니다…</strong>
<script>
(async()=>{
  const params=new URLSearchParams(window.location.search)
  const embedded=params.get('embed')==='1'
  const activeLawName=params.get('law')||''
  if(!embedded){
    window.location.replace('./#/public-law')
    return
  }

  try{
    const files=Array.from({length:11},(_,i)=>`public-law-p${String(i+1).padStart(2,'0')}.dat`)
    const parts=await Promise.all(files.map(async(file)=>{
      const response=await fetch(file,{cache:'no-store'})
      if(!response.ok) throw new Error(`${file}: ${response.status}`)
      return response.text()
    }))
    const base64=parts.join('').replace(/\s+/g,'')
    const binary=atob(base64)
    const bytes=Uint8Array.from(binary,char=>char.charCodeAt(0))
    if(typeof DecompressionStream==='undefined') throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다.')
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))
    let html=await new Response(stream).text()

    const override=`<style id="registration-page-theme">

}

body,body *{font-size:var(--app-font-base)!important}
body h1,body h2,body h3,body h4,body h5,body h6,
body button,body summary,body .t,body .deep-title,body .tldr b{

}

  border:1px solid #e6ebf1!important;

}

    const bridge=`<script id="public-law-embed-bridge">
(()=>{
  const lawName=${JSON.stringify(activeLawName)};
  const send=()=>{
    const h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);
    parent.postMessage({type:'public-law:height',height:h},location.origin);
  };
  const decorateLawReferences=()=>{
    if(!lawName)return;
    const articlePattern=/제\\s*(\\d+)\\s*조(?:의\\s*(\\d+))?/g;
    const skipTags=new Set(['SCRIPT','STYLE','BUTTON','A','TEXTAREA','INPUT','SELECT','OPTION']);
    const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{
      acceptNode(node){
        const parentElement=node.parentElement;
        if(!parentElement||skipTags.has(parentElement.tagName)||parentElement.closest('.embedded-law-reference'))return NodeFilter.FILTER_REJECT;
        articlePattern.lastIndex=0;
        return articlePattern.test(node.nodeValue||'')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
      }
    });
    const nodes=[];
    while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(node=>{
      const text=node.nodeValue||'';
      const fragment=document.createDocumentFragment();
      let lastIndex=0;
      articlePattern.lastIndex=0;
      for(const match of text.matchAll(articlePattern)){
        fragment.append(document.createTextNode(text.slice(lastIndex,match.index)));
        const button=document.createElement('button');
        button.type='button';
        button.className='embedded-law-reference';
        button.dataset.article='제'+match[1]+'조'+(match[2]?'의'+match[2]:'');
        button.title=lawName+' '+button.dataset.article+' 본문 열기';
        button.textContent=match[0];
        fragment.append(button);
        lastIndex=match.index+match[0].length;
      }
      fragment.append(document.createTextNode(text.slice(lastIndex)));
      node.replaceWith(fragment);
    });
  };
  document.addEventListener('click',event=>{
    const reference=event.target.closest&&event.target.closest('.embedded-law-reference');
    if(reference){
      event.preventDefault();
      event.stopPropagation();
      parent.postMessage({type:'public-law:open-law-reference',detail:{subjectId:'public-law',lawName:lawName,article:reference.dataset.article}},location.origin);
    }
    setTimeout(send,80);
  },true);
  window.addEventListener('load',()=>{decorateLawReferences();send();setTimeout(send,120);setTimeout(send,500)});
  decorateLawReferences();
  setTimeout(send,0);
  if(window.ResizeObserver){new ResizeObserver(send).observe(document.documentElement)}
})();
<\/script>`

    html=html.replace(/<span>글자크기 11pt 통일<\/span>/,'<span>글자크기: 본문 12pt · 중요 텍스트 14pt</span>')
    html=html.replace('</head>',`${override}</head>`)
    html=html.replace('</body>',`${bridge}</body>`)
    document.open()
    document.write(html)
    document.close()
  }catch(error){
    document.body.innerHTML=`<strong>공법 내용을 불러오지 못했습니다.</strong><p>${String(error)}</p>`
  }
})()
</script>
</body>
