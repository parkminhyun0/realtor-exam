<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>부동산공법 핵심정리</title>
<style>
  body{margin:0;font-family:Inter,Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#172033;padding:20px;font-size:12pt;line-height:1.6}
  strong{font-size:14pt}
</style>
</head>
<body>
<strong>부동산공법 전체 내용을 불러오는 중입니다…</strong>
<script>
(async()=>{
  const embedded=new URLSearchParams(window.location.search).get('embed')==='1'
  if(!embedded){
    window.location.replace('./#/public-law')
    return
  }

  try{
    const files=Array.from({length:11},(_,i)=>`public-law-p${String(i+1).padStart(2,'0')}.dat`)
    const parts=await Promise.all(files.map(async(file)=>{
      const response=await fetch(file,{cache:'no-store'})
      if(!response.ok) throw new Error(`${file}: ${response.status}`)
      return response.text()
    }))
    const base64=parts.join('').replace(/\s+/g,'')
    const binary=atob(base64)
    const bytes=Uint8Array.from(binary,char=>char.charCodeAt(0))
    if(typeof DecompressionStream==='undefined') throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다.')
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))
    let html=await new Response(stream).text()

    const override=`<style id="realtor-integrated-theme">
:root{
  --app-font-base:12pt;
  --app-font-important:14pt;
  --ink:#172033;
  --muted:#697386;
  --line:#dde3ea;
  --surface:#ffffff;
  --soft:#f7f8fa;
  --navy:#14223a;
  --navy-2:#223a5e;
  --gold:#b9852b;
  --gold-soft:#fbf3e4;
  --green:#1f7a65;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#f4f6f8!important}
body{margin:0!important;padding:18px!important;background:#f4f6f8!important;color:var(--ink)!important;font-family:Inter,Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
body,body *{font-size:var(--app-font-base)!important}
body h1,body h2,body h3,body h4,body h5,body h6,
body button,body summary,body .brand,body .brand strong,
body .t,body .deep-title,body .tldr b,body .view-indicator,
body .view-indicator b,body .ch-head .num{
  font-size:var(--app-font-important)!important
}
button,summary,[role="button"]{min-height:44px}
img,svg,video,canvas{max-width:100%;height:auto}
.hero{display:none!important}
.wrap{
  display:grid!important;
  grid-template-columns:280px minmax(0,1fr)!important;
  gap:20px!important;
  align-items:start!important;
  min-height:0!important;
  background:transparent!important;
}
nav.toc{
  position:sticky!important;
  top:0!important;
  height:calc(100vh - 36px)!important;
  max-height:none!important;
  overflow:auto!important;
  padding:14px 12px 18px!important;
  border:1px solid var(--line)!important;
  border-radius:18px!important;
  background:var(--surface)!important;
  color:var(--ink)!important;
  box-shadow:0 12px 30px rgba(23,32,51,.05)!important;
}
nav.toc,nav.toc *{color:var(--ink)!important}
nav.toc a,nav.toc button,nav.toc summary,
nav.toc .chap-title,nav.toc [role="button"]{
  border-radius:10px!important;
  background:transparent!important;
}
nav.toc a:hover,nav.toc button:hover,nav.toc summary:hover,
nav.toc .active,nav.toc a.active,nav.toc button.active{
  background:var(--gold-soft)!important;
  color:var(--navy)!important;
}
nav.toc .active,nav.toc a.active,nav.toc button.active{
  box-shadow:inset 3px 0 0 var(--gold)!important;
  font-weight:800!important;
}
main{
  width:100%!important;
  min-width:0!important;
  max-width:none!important;
  margin:0!important;
  padding:0!important;
  background:transparent!important;
  color:var(--ink)!important;
}
.view-indicator{
  margin:0 0 14px!important;
  padding:12px 14px!important;
  border:1px solid var(--line)!important;
  border-radius:14px!important;
  background:var(--surface)!important;
  color:var(--muted)!important;
}
.ch-head{
  margin:0 0 14px!important;
  padding:18px 20px!important;
  border:1px solid var(--line)!important;
  border-radius:18px!important;
  background:var(--surface)!important;
  box-shadow:0 10px 28px rgba(23,32,51,.04)!important;
}
.ch-head .num{color:var(--gold)!important}
.card,.section-deep,.inline-proc,.proc-table,.quiz,.box,.callout{
  max-width:100%!important;
  border-color:var(--line)!important;
  border-radius:16px!important;
  background:var(--surface)!important;
  box-shadow:none!important;
}
.card,.section-deep,.inline-proc{margin-bottom:14px!important}
.tldr{
  border:0!important;
  border-radius:16px!important;
  background:var(--navy)!important;
  color:#fff!important;
  box-shadow:none!important;
}
.tldr,.tldr *{color:#fff!important}
.tldr b{color:#ffd86b!important}
table{border-color:var(--line)!important;background:#fff!important}
th,td{border-color:var(--line)!important}
thead th{background:#eef2f7!important;color:#24344d!important}
tbody th{background:#f8fafc!important;color:#263950!important}
.inline-proc .step,.proc-step{
  border-color:#cbd7e4!important;
  border-radius:12px!important;
  background:#f9fbfe!important;
  color:var(--ink)!important;
}
.inline-proc .arr,.proc-arrow{color:#8390a0!important}
.tag,.badge,.pill{
  border-color:#e0c995!important;
  background:var(--gold-soft)!important;
  color:#76551d!important;
}
input,select,textarea{
  border:1px solid var(--line)!important;
  border-radius:10px!important;
  background:#fff!important;
  color:var(--ink)!important;
}
@media(max-width:900px){
  body{padding:12px!important}
  .wrap{grid-template-columns:1fr!important;gap:14px!important}
  nav.toc{
    position:static!important;
    height:auto!important;
    max-height:46vh!important;
    overflow:auto!important;
  }
  main{width:100%!important;padding:0!important}
  .card,.inline-proc,.proc-table{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:700px}
  .two,.section-deep .deep-grid{grid-template-columns:1fr!important}
}
@media(max-width:560px){
  body{padding:8px!important}
  nav.toc{padding:10px!important;border-radius:14px!important;max-height:42vh!important}
  .ch-head,.card,.section-deep,.inline-proc{padding:12px!important;border-radius:14px!important}
  .proc-flow{flex-direction:column!important}
  .inline-proc .step{min-width:100%!important;flex-basis:auto!important}
  .inline-proc .arr{transform:rotate(90deg);align-self:center!important}
}
</style>`

    html=html.replace(/<span>글자크기 11pt 통일<\/span>/,'<span>글자크기: 본문 12pt · 중요 텍스트 14pt</span>')
    html=html.replace('</head>',`${override}</head>`)
    document.open()
    document.write(html)
    document.close()
  }catch(error){
    document.body.innerHTML=`<strong>공법 내용을 불러오지 못했습니다.</strong><p>${String(error)}</p>`
  }
})()
</script>
</body>
</html>
