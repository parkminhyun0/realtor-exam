<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470"><rect width="1120" height="470" rx="28" fill="#f8fbfa"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#244b43">점유권 판단 구조</text><rect x="56" y="95" width="250" height="130" rx="18" fill="#e7f3ef" stroke="#316d63" stroke-width="2"/><text x="84" y="137" font-family="sans-serif" font-size="21" font-weight="700" fill="#316d63">사실상 지배</text><text x="84" y="176" font-family="sans-serif" font-size="17" fill="#46645d">제192조 점유권 발생</text><text x="84" y="207" font-family="sans-serif" font-size="17" fill="#46645d">직접점유 / 간접점유</text><path d="M306 160 H370" stroke="#71837e" stroke-width="4"/><polygon points="370,160 354,151 354,169" fill="#71837e"/><rect x="370" y="80" width="300" height="160" rx="18" fill="#fff" stroke="#9db0aa" stroke-width="2"/><text x="398" y="122" font-family="sans-serif" font-size="21" font-weight="700" fill="#34534c">점유의 태양</text><text x="398" y="160" font-family="sans-serif" font-size="17" fill="#50635f">제197조: 자주 · 선의 · 평온 · 공연 추정</text><text x="398" y="194" font-family="sans-serif" font-size="17" fill="#50635f">제198조: 전후 두 시점 점유 → 계속 추정</text><text x="398" y="224" font-family="sans-serif" font-size="17" fill="#50635f">제199조: 승계 주장 시 하자도 승계</text><path d="M670 160 H734" stroke="#71837e" stroke-width="4"/><polygon points="734,160 718,151 718,169" fill="#71837e"/><rect x="734" y="80" width="330" height="160" rx="18" fill="#fff7e8" stroke="#c39a43" stroke-width="2"/><text x="762" y="122" font-family="sans-serif" font-size="21" font-weight="700" fill="#806327">점유보호청구권</text><text x="762" y="160" font-family="sans-serif" font-size="17" fill="#655b42">침탈 → 제204조 회수</text><text x="762" y="194" font-family="sans-serif" font-size="17" fill="#655b42">방해 → 제205조 보유</text><text x="762" y="224" font-family="sans-serif" font-size="17" fill="#655b42">방해 위험 → 제206조 보전</text><rect x="56" y="285" width="1008" height="120" rx="18" fill="#fff" stroke="#d6dedb"/><text x="84" y="326" font-family="sans-serif" font-size="20" font-weight="700" fill="#3c544e">점유자 ↔ 회복자</text><text x="84" y="362" font-family="sans-serif" font-size="17" fill="#50645f">과실 제201조 · 멸실/훼손 제202조 · 필요비/유익비 제203조를 각각 따로 판단</text><text x="84" y="394" font-family="sans-serif" font-size="17" font-weight="700" fill="#b42323">점유의 소와 본권의 소는 별개(제208조) — 소유권 판단과 점유보호 판단을 섞지 않음</text><text x="56" y="445" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">암기: 자·선·평·공 / 침탈=회수 · 방해=보유 · 위험=보전</text></svg>