<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a2b4c6;stroke-width:2}.a{fill:#eef5fb}.b{fill:#fff5e9}.c{fill:#fff0ee}.arrow{stroke:#71869a;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71869a"/></marker></defs><text x="40" y="40" class="t">매매계약금 해제 판단</text><rect x="40" y="80" rx="14" width="245" height="135" class="box a"/><text x="62" y="116" class="h">계약금 교부</text><text x="62" y="148" class="s">다른 약정 없으면 해약금 추정</text><rect x="365" y="80" rx="14" width="245" height="135" class="box b"/><text x="387" y="116" class="h">이행착수 전?</text><text x="387" y="148" class="s">예 → 해약금 해제 가능</text><text x="387" y="176" class="s">아니오 → 제565조 해제 불가</text><rect x="690" y="80" rx="14" width="245" height="135" class="box c"/><text x="712" y="116" class="h">해제 방법</text><text x="712" y="148" class="s">교부자: 계약금 포기</text><text x="712" y="176" class="s">수령자: 배액 상환</text><line x1="285" y1="147" x2="355" y2="147" class="arrow"/><line x1="610" y1="147" x2="680" y2="147" class="arrow"/><text x="40" y="266" class="s">민법 제565조 · 해약금 해제에는 제551조 손해배상 규정이 적용되지 않음</text></svg>