<svg xmlns="http://www.w3.org/2000/svg" width="980" height="370" viewBox="0 0 980 370"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a0b3c5;stroke-width:2}.a{fill:#eef6ff}.b{fill:#fff4ec}.arrow{font-size:24px;font-weight:700;fill:#7a8da0}</style><text x="40" y="40" class="t">우선변제권 · 최우선변제권 비교</text><rect x="45" y="78" width="420" height="232" rx="16" class="box a"/><text x="70" y="112" class="h">주택</text><text x="70" y="150" class="s">대항요건 + 확정일자</text><text x="70" y="181" class="arrow">↓</text><text x="110" y="181" class="h">우선변제권</text><text x="70" y="224" class="s">소액임차인 + 시행령상 지역별 기준</text><text x="70" y="255" class="arrow">↓</text><text x="110" y="255" class="h">보증금 중 일정액 최우선변제</text><rect x="515" y="78" width="420" height="232" rx="16" class="box b"/><text x="540" y="112" class="h">상가</text><text x="540" y="150" class="s">대항요건 + 세무서 확정일자</text><text x="540" y="181" class="arrow">↓</text><text x="580" y="181" class="h">우선변제권</text><text x="540" y="224" class="s">소액임차인 + 시행령상 별도 기준</text><text x="540" y="255" class="arrow">↓</text><text x="580" y="255" class="h">보증금 중 일정액 최우선변제</text><text x="40" y="347" class="s">숫자 기준은 주택 시행령과 상가 시행령이 서로 다르므로 반드시 해당 법률의 시행령을 따로 적용합니다.</text></svg>