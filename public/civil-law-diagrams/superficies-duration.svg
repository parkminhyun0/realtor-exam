<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360"><rect width="1120" height="360" rx="28" fill="#f8faf9"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#24483f">지상권 최단존속기간 · 민법 제280조</text><rect x="56" y="110" width="310" height="150" rx="20" fill="#eaf5ef" stroke="#316d63" stroke-width="2"/><text x="84" y="152" font-family="sans-serif" font-size="21" font-weight="700" fill="#316d63">견고한 건물 · 수목</text><text x="84" y="215" font-family="sans-serif" font-size="38" font-weight="800" fill="#b42323">30년</text><rect x="405" y="110" width="310" height="150" rx="20" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="433" y="152" font-family="sans-serif" font-size="21" font-weight="700" fill="#315f8f">그 밖의 건물</text><text x="433" y="215" font-family="sans-serif" font-size="38" font-weight="800" fill="#b42323">15년</text><rect x="754" y="110" width="310" height="150" rx="20" fill="#fff7e8" stroke="#c2953e" stroke-width="2"/><text x="782" y="152" font-family="sans-serif" font-size="21" font-weight="700" fill="#806327">건물 이외 공작물</text><text x="782" y="215" font-family="sans-serif" font-size="38" font-weight="800" fill="#b42323">5년</text><text x="56" y="310" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">주의: 최고기간이 아니라 최단기간 — 더 짧게 약정하면 법정 최단기간까지 연장</text></svg>