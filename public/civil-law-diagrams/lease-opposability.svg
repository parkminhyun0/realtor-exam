<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#9fb3c6;stroke-width:2}.a{fill:#eef5fb}.b{fill:#eef8f2}.c{fill:#fff5e9}.arrow{stroke:#71869a;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71869a"/></marker></defs><text x="40" y="40" class="t">민법상 임차권의 제3자 대항력</text><rect x="40" y="80" rx="14" width="275" height="175" class="box a"/><text x="62" y="116" class="h">일반 부동산임대차</text><text x="62" y="148" class="s">임대차등기</text><text x="62" y="176" class="s">→ 그때부터 제3자 효력</text><text x="62" y="204" class="s">민법 제621조</text><rect x="355" y="80" rx="14" width="275" height="175" class="box b"/><text x="377" y="116" class="h">건물소유 목적 토지임대차</text><text x="377" y="148" class="s">토지임대차등기 없어도</text><text x="377" y="176" class="s">지상건물 등기 → 제3자 효력</text><text x="377" y="204" class="s">민법 제622조</text><rect x="670" y="80" rx="14" width="270" height="175" class="box c"/><text x="692" y="116" class="h">특별법 대항력</text><text x="692" y="148" class="s">주택·상가 임대차는 별도 요건</text><text x="692" y="176" class="s">민법 제621·622와 구별</text><text x="692" y="204" class="s">PART 4에서 별도 학습</text><line x1="315" y1="168" x2="345" y2="168" class="arrow"/><line x1="630" y1="168" x2="660" y2="168" class="arrow"/><text x="40" y="304" class="s">시험 함정: 민법상 임대차등기와 주택·상가 특별법의 대항요건을 서로 바꾸지 않습니다.</text></svg>