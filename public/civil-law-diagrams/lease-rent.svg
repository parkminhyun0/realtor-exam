<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a0b3c5;stroke-width:2}.a{fill:#fff1ee}.b{fill:#eef5fb}</style><text x="40" y="40" class="t">차임 감액·증감청구 구별</text><rect x="70" y="82" rx="14" width="390" height="185" class="box a"/><text x="95" y="120" class="h">제627조 · 일부 사용·수익불능</text><text x="95" y="153" class="s">임차인의 과실 없이 일부 멸실 등</text><text x="95" y="181" class="s">→ 그 부분 비율에 따른 차임 감액</text><text x="95" y="209" class="s">잔존부분만으로 목적 달성 불가 시 해지 문제</text><rect x="520" y="82" rx="14" width="390" height="185" class="box b"/><text x="545" y="120" class="h">제628조 · 경제사정 변동</text><text x="545" y="153" class="s">공과부담 증감·경제사정 변동</text><text x="545" y="181" class="s">약정 차임이 상당하지 않게 됨</text><text x="545" y="209" class="s">→ 장래에 대하여 증액 또는 감액 청구</text><text x="40" y="306" class="s">시험 핵심: 목적물 일부 사용불능인지, 경제사정 변동인지 원인을 먼저 구별합니다.</text></svg>