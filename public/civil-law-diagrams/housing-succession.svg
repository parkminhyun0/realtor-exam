<svg xmlns="http://www.w3.org/2000/svg" width="980" height="310" viewBox="0 0 980 310"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}.y{fill:#fff7df}</style><text x="40" y="42" class="t">주택 임차권의 특별승계</text><rect x="45" y="84" width="220" height="145" rx="14" class="b a"/><text x="70" y="120" class="h">임차인 사망</text><text x="70" y="152" class="s">사망 당시 주택에서</text><text x="70" y="178" class="s">가정공동생활 확인</text><text x="290" y="158" class="h">→</text><rect x="335" y="84" width="270" height="145" rx="14" class="b g"/><text x="360" y="120" class="h">상속인 없는 경우</text><text x="360" y="152" class="s">사실혼 배우자가</text><text x="360" y="178" class="s">임차권의 권리·의무 승계</text><text x="630" y="158" class="h">/</text><rect x="670" y="84" width="270" height="145" rx="14" class="b y"/><text x="695" y="120" class="h">상속인과 비동거한 경우</text><text x="695" y="152" class="s">사실혼 배우자 +</text><text x="695" y="178" class="s">2촌 이내 친족 공동승계 가능</text><text x="40" y="270" class="s">승계대상자는 임차인 사망 후 1개월 이내 임대인에게 반대의사를 표시할 수 있습니다.</text></svg>