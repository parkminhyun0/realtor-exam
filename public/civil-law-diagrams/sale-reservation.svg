<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a0b3c5;stroke-width:2}.a{fill:#eef5fb}.b{fill:#fff5e9}.c{fill:#eef8f2}.arrow{stroke:#71869a;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71869a"/></marker></defs><text x="40" y="40" class="t">매매의 일방예약</text><rect x="40" y="82" rx="14" width="245" height="135" class="box a"/><text x="62" y="118" class="h">① 일방예약</text><text x="62" y="150" class="s">예약완결권을 발생시킴</text><text x="62" y="178" class="s">예약 ≠ 아직 본매매 완결</text><rect x="365" y="82" rx="14" width="245" height="135" class="box b"/><text x="387" y="118" class="h">② 완결의사표시</text><text x="387" y="150" class="s">예약완결권자가 표시</text><text x="387" y="178" class="s">민법 제564조</text><rect x="690" y="82" rx="14" width="245" height="135" class="box c"/><text x="712" y="118" class="h">③ 매매의 효력 발생</text><text x="712" y="150" class="s">완결의사표시 시 본매매 성립</text><text x="712" y="178" class="s">예약과 본계약 시점 구별</text><line x1="285" y1="150" x2="355" y2="150" class="arrow"/><line x1="610" y1="150" x2="680" y2="150" class="arrow"/><text x="40" y="270" class="s">시험 핵심: 예약 자체의 성립시점과 예약완결권 행사에 따른 본매매 효력발생시점을 구별합니다.</text></svg>