<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.n{font-size:24px;font-weight:800;fill:#b42323}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}</style><text x="40" y="42" class="t">주택 차임·보증금 증감청구</text><rect x="55" y="85" width="255" height="135" rx="14" class="b a"/><text x="80" y="121" class="h">경제사정 변동</text><text x="80" y="154" class="s">조세·공과금·경제사정 등</text><text x="80" y="181" class="s">약정액이 적절하지 않음</text><text x="338" y="154" class="h">→</text><rect x="385" y="85" width="255" height="135" rx="14" class="b g"/><text x="410" y="121" class="h">장래의 증감청구</text><text x="410" y="154" class="s">증액 또는 감액</text><text x="410" y="181" class="s">효력은 장래에 향함</text><text x="668" y="154" class="h">→</text><rect x="715" y="85" width="220" height="135" rx="14" class="b"/><text x="740" y="121" class="h">증액 제한</text><text x="740" y="159" class="n">5%</text><text x="815" y="159" class="s">이하</text><text x="740" y="190" class="s">재증액: 1년 이후</text><text x="40" y="260" class="s">시험 핵심: 20분의 1 = 5%. 증액 제한을 감액청구에도 그대로 적용한다고 단정하지 않습니다.</text></svg>