<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384f}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#64768a}.box{fill:#fff;stroke:#9fb2c5;stroke-width:2}.c1{fill:#eef5fb}.c2{fill:#fff5e9}.c3{fill:#eef8f2}.c4{fill:#f5effa}</style><text x="40" y="40" class="t">계약의 주요 분류</text><rect x="40" y="75" rx="14" width="210" height="170" class="box c1"/><text x="62" y="112" class="h">쌍무 ↔ 편무</text><text x="62" y="145" class="s">서로 대가적 채무가 있는가</text><text x="62" y="175" class="s">동시이행·위험부담과 연결</text><rect x="275" y="75" rx="14" width="210" height="170" class="box c2"/><text x="297" y="112" class="h">유상 ↔ 무상</text><text x="297" y="145" class="s">경제적 대가가 있는가</text><text x="297" y="175" class="s">매매·임대차 = 유상</text><rect x="510" y="75" rx="14" width="210" height="170" class="box c3"/><text x="532" y="112" class="h">낙성 ↔ 요물</text><text x="532" y="145" class="s">합의만으로 성립하는가</text><text x="532" y="175" class="s">매매·임대차 = 낙성</text><rect x="745" y="75" rx="14" width="195" height="170" class="box c4"/><text x="767" y="112" class="h">일시 ↔ 계속</text><text x="767" y="145" class="s">급부가 시간적으로 계속되는가</text><text x="767" y="175" class="s">임대차 = 계속적 계약</text><text x="40" y="292" class="s">※ 분류 자체는 시험이론이며, 각 계약의 민법 조문과 연결해 판단합니다.</text></svg>