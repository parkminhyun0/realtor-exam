<svg xmlns="http://www.w3.org/2000/svg" width="980" height="310" viewBox="0 0 980 310"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.n{font-size:23px;font-weight:800;fill:#b42323}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}.y{fill:#fff7df}</style><text x="40" y="42" class="t">관리단 · 관리인 구조</text><rect x="45" y="84" width="250" height="145" rx="14" class="b a"/><text x="70" y="120" class="h">구분소유관계 성립</text><text x="70" y="153" class="s">별도 설립행위 불필요</text><text x="320" y="158" class="h">→</text><rect x="365" y="84" width="250" height="145" rx="14" class="b g"/><text x="390" y="120" class="h">관리단 당연 설립</text><text x="390" y="153" class="s">구분소유자 전원 구성원</text><text x="640" y="158" class="h">→</text><rect x="685" y="84" width="250" height="145" rx="14" class="b y"/><text x="710" y="120" class="h">관리인</text><text x="710" y="154" class="n">10인 이상</text><text x="710" y="184" class="s">선임 의무 · 임기 ≤ 2년</text><text x="40" y="270" class="s">관리인은 구분소유자일 필요가 없습니다. 관리단과 관리인을 동일개념으로 보지 않습니다.</text></svg>