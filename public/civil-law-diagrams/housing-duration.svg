<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.n{font-size:24px;font-weight:800;fill:#b42323}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}.y{fill:#fff7df}</style><text x="40" y="42" class="t">주택임대차 기간 · 갱신 숫자 지도</text><rect x="40" y="82" width="210" height="145" rx="14" class="b a"/><text x="65" y="118" class="h">최소 보호기간</text><text x="65" y="160" class="n">2년</text><text x="65" y="192" class="s">임차인은 짧은 약정 주장 가능</text><rect x="275" y="82" width="210" height="145" rx="14" class="b g"/><text x="300" y="118" class="h">묵시적 갱신</text><text x="300" y="160" class="n">2년</text><text x="300" y="192" class="s">임차인 해지 → 3개월 후</text><rect x="510" y="82" width="210" height="145" rx="14" class="b y"/><text x="535" y="118" class="h">갱신요구권</text><text x="535" y="160" class="n">1회 · 2년</text><text x="535" y="192" class="s">법정 거절사유 별도 확인</text><rect x="745" y="82" width="195" height="145" rx="14" class="b"/><text x="770" y="118" class="h">통지기간</text><text x="770" y="151" class="s">임대인: 6개월 전</text><text x="770" y="177" class="s">~ 2개월 전</text><text x="770" y="203" class="s">임차인: 2개월 전까지</text><text x="40" y="276" class="s">같은 ‘2년’이라도 최소기간·묵시갱신·갱신요구의 법적 의미가 서로 다릅니다.</text></svg>