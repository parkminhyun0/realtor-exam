<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a0b3c5;stroke-width:2}.a{fill:#eef6ff}.b{fill:#fff4ec}.arrow{font-size:28px;font-weight:700;fill:#7a8da0}</style><text x="40" y="40" class="t">대항력 성립요건 비교</text><rect x="45" y="82" width="420" height="205" rx="16" class="box a"/><text x="70" y="116" class="h">주택</text><text x="70" y="155" class="s">주택의 인도</text><text x="184" y="155" class="arrow">+</text><text x="225" y="155" class="s">주민등록(전입신고)</text><text x="70" y="207" class="arrow">↓</text><text x="110" y="207" class="h">다음 날부터 제3자 대항</text><text x="70" y="252" class="s">확정일자는 대항력 요건이 아니라 우선변제권에서 추가</text><rect x="515" y="82" width="420" height="205" rx="16" class="box b"/><text x="540" y="116" class="h">상가</text><text x="540" y="155" class="s">건물의 인도</text><text x="650" y="155" class="arrow">+</text><text x="692" y="155" class="s">사업자등록 신청</text><text x="540" y="207" class="arrow">↓</text><text x="580" y="207" class="h">다음 날부터 제3자 대항</text><text x="540" y="252" class="s">주민등록이 아니라 사업자등록 신청이라는 점을 구별</text><text x="40" y="327" class="s">공통점은 “인도 + 공시요건 → 다음 날”, 차이는 주민등록과 사업자등록 신청입니다.</text></svg>