<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420"><rect width="1120" height="420" rx="28" fill="#f7faf9"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#173e37">물권법의 출발점</text><rect x="56" y="94" width="290" height="220" rx="20" fill="#e7f3ef" stroke="#316d63" stroke-width="2"/><text x="84" y="136" font-family="sans-serif" font-size="21" font-weight="700" fill="#214e47">물권</text><text x="84" y="174" font-family="sans-serif" font-size="17" fill="#355f58">• 물건에 대한 직접 지배</text><text x="84" y="207" font-family="sans-serif" font-size="17" fill="#355f58">• 배타성 · 우선성</text><text x="84" y="240" font-family="sans-serif" font-size="17" fill="#355f58">• 법률·관습법으로 종류 제한</text><text x="84" y="273" font-family="sans-serif" font-size="17" fill="#355f58">• 공시 필요</text><rect x="415" y="94" width="290" height="220" rx="20" fill="#fff" stroke="#8aa39d" stroke-width="2"/><text x="443" y="136" font-family="sans-serif" font-size="21" font-weight="700" fill="#334f49">채권</text><text x="443" y="174" font-family="sans-serif" font-size="17" fill="#4a625d">• 특정인에 대한 급부청구</text><text x="443" y="207" font-family="sans-serif" font-size="17" fill="#4a625d">• 상대권</text><text x="443" y="240" font-family="sans-serif" font-size="17" fill="#4a625d">• 계약자유에 따라 내용 다양</text><text x="443" y="273" font-family="sans-serif" font-size="17" fill="#4a625d">• 임차권은 원칙적으로 채권</text><rect x="774" y="94" width="290" height="220" rx="20" fill="#fff7e9" stroke="#c49b45" stroke-width="2"/><text x="802" y="136" font-family="sans-serif" font-size="21" font-weight="700" fill="#735b26">민법 제185조</text><text x="802" y="176" font-family="sans-serif" font-size="17" fill="#685a3c">법률 또는 관습법에</text><text x="802" y="207" font-family="sans-serif" font-size="17" fill="#685a3c">의하지 않고는</text><text x="802" y="238" font-family="sans-serif" font-size="17" fill="#685a3c">물권을 임의로 창설할 수 없음</text><text x="56" y="365" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">시험순서: 권리의 성질 → 공시방법 → 제3자에게 주장 가능한지 → 물권적 청구권</text></svg>