<svg xmlns="http://www.w3.org/2000/svg" width="980" height="370" viewBox="0 0 980 370"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a0b3c5;stroke-width:2}.a{fill:#eef6ff}.b{fill:#fff4ec}.num{font-size:28px;font-weight:800;fill:#b42323}</style><text x="40" y="40" class="t">존속기간 · 갱신제도 비교</text><rect x="45" y="78" width="420" height="238" rx="16" class="box a"/><text x="70" y="112" class="h">주택임대차</text><text x="70" y="154" class="num">2년</text><text x="145" y="154" class="s">최소 보호기간</text><text x="70" y="198" class="num">1회 · 2년</text><text x="208" y="198" class="s">계약갱신요구권</text><text x="70" y="242" class="num">3개월</text><text x="170" y="242" class="s">묵시갱신 후 임차인 해지통고 효력</text><rect x="515" y="78" width="420" height="238" rx="16" class="box b"/><text x="540" y="112" class="h">상가건물 임대차</text><text x="540" y="154" class="num">1년</text><text x="615" y="154" class="s">최소 보호기간</text><text x="540" y="198" class="num">10년</text><text x="630" y="198" class="s">최초기간 포함 갱신요구 전체 한도</text><text x="540" y="242" class="s">갱신거절사유와 묵시갱신은 별도 판단</text><text x="40" y="347" class="s">시험 핵심: 주택의 2년·1회·3개월과 상가의 1년·전체 10년을 서로 바꾸어 내는 선지를 주의합니다.</text></svg>