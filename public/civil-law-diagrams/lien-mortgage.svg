<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450"><rect width="1120" height="450" rx="28" fill="#f9faf9"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#2f493f">유치권 ↔ 저당권</text><rect x="56" y="100" width="470" height="250" rx="20" fill="#eaf5ef" stroke="#316d63" stroke-width="2"/><text x="86" y="144" font-family="sans-serif" font-size="23" font-weight="700" fill="#316d63">유치권 · 제320조</text><text x="86" y="184" font-family="sans-serif" font-size="17" fill="#48635c">타인의 물건 또는 유가증권</text><text x="86" y="218" font-family="sans-serif" font-size="17" fill="#48635c">그 물건에 관하여 생긴 채권</text><text x="86" y="252" font-family="sans-serif" font-size="17" fill="#48635c">변제기 도래 + 적법한 점유</text><text x="86" y="286" font-family="sans-serif" font-size="17" fill="#48635c">점유가 공시 · 점유상실 시 소멸</text><text x="86" y="321" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">핵심 효력: 변제받을 때까지 유치</text><rect x="594" y="100" width="470" height="250" rx="20" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="624" y="144" font-family="sans-serif" font-size="23" font-weight="700" fill="#315f8f">저당권 · 제356조</text><text x="624" y="184" font-family="sans-serif" font-size="17" fill="#495d72">점유를 이전하지 않음</text><text x="624" y="218" font-family="sans-serif" font-size="17" fill="#495d72">설정계약 + 등기</text><text x="624" y="252" font-family="sans-serif" font-size="17" fill="#495d72">부동산의 교환가치를 지배</text><text x="624" y="286" font-family="sans-serif" font-size="17" fill="#495d72">피담보채권과 부종성</text><text x="624" y="321" font-family="sans-serif" font-size="18" font-weight="700" fill="#315f8f">핵심 효력: 다른 채권자보다 우선변제</text><text x="56" y="405" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">유치권 = 점유 / 저당권 = 등기 · 점유이전 없음 — 성립방식과 핵심효력을 먼저 구별</text></svg>