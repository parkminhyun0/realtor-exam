<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430"><rect width="1120" height="430" rx="28" fill="#fafbfc"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#25384d">등기 · 가등기 · 본등기의 관계</text><rect x="56" y="105" width="260" height="150" rx="18" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="84" y="147" font-family="sans-serif" font-size="21" font-weight="700" fill="#315f8f">민법 제186조</text><text x="84" y="184" font-family="sans-serif" font-size="17" fill="#455b71">법률행위에 의한</text><text x="84" y="216" font-family="sans-serif" font-size="17" fill="#455b71">부동산 물권변동</text><text x="84" y="246" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">등기 = 효력요건</text><path d="M316 180 H390" stroke="#75879a" stroke-width="4"/><polygon points="390,180 374,171 374,189" fill="#75879a"/><rect x="390" y="85" width="290" height="190" rx="18" fill="#fff7e8" stroke="#c39336" stroke-width="2"/><text x="418" y="128" font-family="sans-serif" font-size="21" font-weight="700" fill="#84621f">부동산등기법 제88조</text><text x="418" y="166" font-family="sans-serif" font-size="17" fill="#66583c">가등기 = 장래 본등기 청구권 보전</text><text x="418" y="198" font-family="sans-serif" font-size="17" fill="#66583c">시기부·정지조건부·장래확정 청구권도 가능</text><text x="418" y="237" font-family="sans-serif" font-size="16" fill="#7b6540">가등기 자체로 완전한 물권변동이 되는 것은 아님</text><path d="M680 180 H754" stroke="#75879a" stroke-width="4"/><polygon points="754,180 738,171 738,189" fill="#75879a"/><rect x="754" y="105" width="310" height="150" rx="18" fill="#eaf5ef" stroke="#35705f" stroke-width="2"/><text x="782" y="147" font-family="sans-serif" font-size="21" font-weight="700" fill="#2f6757">부동산등기법 제91조</text><text x="782" y="185" font-family="sans-serif" font-size="17" fill="#405f56">가등기에 의한 본등기를 하면</text><text x="782" y="219" font-family="sans-serif" font-size="18" font-weight="700" fill="#2f6757">본등기의 순위는 가등기 순위</text><rect x="56" y="305" width="1008" height="72" rx="16" fill="#fff" stroke="#d3dbe3"/><text x="82" y="350" font-family="sans-serif" font-size="17" font-weight="700" fill="#b42323">판례영역: 등기청구권의 법적 성질 · 등기의 추정력 · 중간생략등기 · 무효등기의 유용은 조문명칭이 아니라 판례법리를 함께 확인</text></svg>