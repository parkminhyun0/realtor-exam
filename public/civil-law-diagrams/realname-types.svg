<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#60758a}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}.y{fill:#fff7df}.r{fill:#fff0ee}</style><text x="40" y="42" class="t">명의신탁 유형 비교</text><rect x="35" y="82" width="215" height="180" rx="14" class="b a"/><text x="60" y="118" class="h">2자간 명의신탁</text><text x="60" y="148" class="s">실권리자 소유 부동산</text><text x="60" y="174" class="s">→ 수탁자 명의 등기</text><text x="60" y="210" class="s">약정·물권변동</text><text x="60" y="234" class="s">원칙적 무효</text><rect x="270" y="82" width="215" height="180" rx="14" class="b g"/><text x="295" y="118" class="h">3자간 등기명의신탁</text><text x="295" y="148" class="s">신탁자 ↔ 매도인 계약</text><text x="295" y="174" class="s">수탁자 앞으로 등기</text><text x="295" y="210" class="s">제4조 + 판례로</text><text x="295" y="234" class="s">소유권관계 판단</text><rect x="505" y="82" width="215" height="180" rx="14" class="b y"/><text x="530" y="118" class="h">계약명의신탁</text><text x="530" y="148" class="s">수탁자가 매도인과 계약</text><text x="530" y="174" class="s">매도인이 신탁사실 몰랐다면</text><text x="530" y="210" class="s">수탁자 명의 물권변동</text><text x="530" y="234" class="s">유효 가능</text><rect x="740" y="82" width="205" height="180" rx="14" class="b r"/><text x="765" y="118" class="h">제8조 특례</text><text x="765" y="148" class="s">종중·배우자·종교단체</text><text x="765" y="174" class="s">+ 위법목적 없음</text><text x="765" y="210" class="s">법정 요건 충족 시</text><text x="765" y="234" class="s">일부 규정 적용 제외</text><text x="40" y="310" class="s">공통 핵심: ‘누가 매매계약 당사자인가’와 ‘매도인이 명의신탁 사실을 알았는가’를 먼저 구별합니다.</text><text x="40" y="337" class="s">세부 소유권 귀속은 부동산실명법 제4조와 관련 판례를 함께 확인합니다.</text></svg>