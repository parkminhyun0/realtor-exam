<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a0b3c5;stroke-width:2}.a{fill:#eef6ff}.b{fill:#fff4ec}.num{font-size:26px;font-weight:800;fill:#b42323}</style><text x="40" y="40" class="t">차임·보증금 증감청구 비교</text><rect x="45" y="82" width="420" height="205" rx="16" class="box a"/><text x="70" y="118" class="h">주택</text><text x="70" y="158" class="s">경제사정 등의 변동 → 장래에 대하여 증감청구</text><text x="70" y="202" class="num">증액 5%</text><text x="208" y="202" class="s">법정 상한</text><text x="70" y="246" class="num">1년</text><text x="140" y="246" class="s">이내 재증액 제한</text><rect x="515" y="82" width="420" height="205" rx="16" class="box b"/><text x="540" y="118" class="h">상가</text><text x="540" y="158" class="s">경제사정 등의 변동 → 장래에 대하여 증감청구</text><text x="540" y="202" class="num">증액 5%</text><text x="678" y="202" class="s">시행령 제4조</text><text x="540" y="246" class="num">1년</text><text x="610" y="246" class="s">이내 재증액 제한</text><text x="40" y="327" class="s">공통 숫자는 비슷해도 근거 법률이 다릅니다. 주택은 주임법, 상가는 상임법·시행령을 각각 확인합니다.</text></svg>