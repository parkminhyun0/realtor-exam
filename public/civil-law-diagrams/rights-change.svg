<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;fill:#23384f}.t{font-size:30px;font-weight:800}.h{font-size:22px;font-weight:800}.b{font-size:18px}.s{font-size:16px;fill:#607184}.box{fill:#fff;stroke:#cfd9e4;stroke-width:2}.blue{fill:#eef5fb;stroke:#6b8db0}.green{fill:#eef8f3;stroke:#6a9b82}.red{fill:#fff3f2;stroke:#c87870}.line{stroke:#8aa0b6;stroke-width:3;fill:none}.arrow{marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8aa0b6"/></marker></defs><text x="60" y="55" class="t">권리변동과 법률사실 · 시험 판단 흐름</text><rect x="70" y="100" width="250" height="95" rx="18" class="blue"/><text x="195" y="138" text-anchor="middle" class="h">법률요건</text><text x="195" y="170" text-anchor="middle" class="b">법률사실의 결합</text><path d="M320 148 H445" class="line arrow"/><rect x="445" y="100" width="250" height="95" rx="18" class="green"/><text x="570" y="138" text-anchor="middle" class="h">법률효과</text><text x="570" y="170" text-anchor="middle" class="b">권리 발생·변경·소멸</text><path d="M695 148 H820" class="line arrow"/><rect x="820" y="100" width="300" height="95" rx="18" class="red"/><text x="970" y="136" text-anchor="middle" class="h">부동산 물권변동</text><text x="970" y="168" text-anchor="middle" class="b">제186조 / 제187조 구별</text><text x="80" y="260" class="h">법률사실의 분류</text><rect x="80" y="292" width="230" height="90" rx="16" class="box"/><text x="195" y="330" text-anchor="middle" class="h">사건</text><text x="195" y="358" text-anchor="middle" class="s">시간경과·출생·사망 등</text><rect x="360" y="292" width="230" height="90" rx="16" class="box"/><text x="475" y="330" text-anchor="middle" class="h">용태</text><text x="475" y="358" text-anchor="middle" class="s">사람의 정신작용 관련</text><rect x="640" y="292" width="230" height="90" rx="16" class="box"/><text x="755" y="330" text-anchor="middle" class="h">외부적 용태</text><text x="755" y="358" text-anchor="middle" class="s">법률행위·사실행위 등</text><rect x="920" y="292" width="230" height="90" rx="16" class="box"/><text x="1035" y="330" text-anchor="middle" class="h">내부적 용태</text><text x="1035" y="358" text-anchor="middle" class="s">선의·악의·고의·과실</text><text x="80" y="446" class="h">등기 판단</text><rect x="80" y="470" width="490" height="62" rx="14" class="blue"/><text x="325" y="509" text-anchor="middle" class="b">법률행위 → 민법 제186조 → 등기해야 효력</text><rect x="630" y="470" width="490" height="62" rx="14" class="green"/><text x="875" y="500" text-anchor="middle" class="b">법률규정 → 민법 제187조 → 취득은 등기 불요</text><text x="875" y="522" text-anchor="middle" class="s">다만 처분하려면 등기 필요</text></svg>