<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#25384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#66788a}.box{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.b{fill:#fff6ea}.c{fill:#eef8f2}.arrow{stroke:#6c8297;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6c8297"/></marker></defs><text x="40" y="40" class="t">계약 성립 판단순서</text><rect x="40" y="78" rx="14" width="240" height="125" class="box a"/><text x="62" y="115" class="h">청약</text><text x="62" y="146" class="s">확정적 계약체결 의사</text><text x="62" y="171" class="s">제527조: 청약의 구속력</text><rect x="370" y="78" rx="14" width="240" height="125" class="box b"/><text x="392" y="115" class="h">승낙</text><text x="392" y="146" class="s">청약과 내용이 일치해야 함</text><text x="392" y="171" class="s">변경승낙 = 거절 + 새 청약</text><rect x="700" y="78" rx="14" width="240" height="125" class="box c"/><text x="722" y="115" class="h">계약 성립</text><text x="722" y="146" class="s">원칙: 청약·승낙 합치</text><text x="722" y="171" class="s">격지자: 승낙 발송시</text><line x1="280" y1="141" x2="360" y2="141" class="arrow"/><line x1="610" y1="141" x2="690" y2="141" class="arrow"/><text x="40" y="250" class="s">특수형: 의사실현(제532조) · 교차청약(제533조) · 연착승낙(제530조)</text><text x="40" y="280" class="s">계약체결상 과실(제535조)은 ‘계약 성립’과 별도의 손해배상 문제입니다.</text></svg>