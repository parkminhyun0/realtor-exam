<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a0b3c5;stroke-width:2}.a{fill:#eef6ff}.b{fill:#fff4ec}.tag{font-size:13px;font-weight:700;fill:#315f8f}</style><text x="40" y="40" class="t">특별임대차 적용범위: 주택 ↔ 상가</text><rect x="55" y="80" width="410" height="210" rx="16" class="box a"/><text x="80" y="116" class="h">주택임대차보호법</text><text x="80" y="145" class="tag">제2조 · 실제 주거용 여부</text><text x="80" y="178" class="s">주거용 건물 전부 또는 일부의 임대차</text><text x="80" y="205" class="s">일부가 주거 외 목적으로 사용되어도 적용 가능</text><text x="80" y="246" class="s">출발점: 실제 사용용도 → 주거용인지 확인</text><rect x="515" y="80" width="410" height="210" rx="16" class="box b"/><text x="540" y="116" class="h">상가건물 임대차보호법</text><text x="540" y="145" class="tag">제2조 + 시행령 제2조</text><text x="540" y="178" class="s">사업자등록 대상 상가건물의 임대차</text><text x="540" y="205" class="s">환산보증금 기준과 적용조항 범위 확인</text><text x="540" y="246" class="s">출발점: 사업자등록 대상 → 환산보증금 확인</text><text x="40" y="327" class="s">시험 핵심: 같은 “적용범위”라도 주택은 실제 주거용성, 상가는 사업자등록 대상성과 환산보증금 체계가 중심입니다.</text></svg>