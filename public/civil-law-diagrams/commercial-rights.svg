<svg xmlns="http://www.w3.org/2000/svg" width="980" height="315" viewBox="0 0 980 315"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.n{font-size:22px;font-weight:800;fill:#b42323}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}.y{fill:#fff7df}</style><text x="40" y="42" class="t">상가 권리금 회수기회 보호</text><rect x="45" y="84" width="240" height="150" rx="14" class="b a"/><text x="70" y="120" class="h">보호기간</text><text x="70" y="158" class="n">종료 6개월 전</text><text x="70" y="188" class="s">~ 임대차 종료 시</text><text x="310" y="160" class="h">→</text><rect x="355" y="84" width="270" height="150" rx="14" class="b g"/><text x="380" y="120" class="h">임대인의 방해 금지</text><text x="380" y="153" class="s">신규임차인과 계약 거절 유도</text><text x="380" y="180" class="s">과도한 차임 요구 등 법정행위</text><text x="650" y="160" class="h">→</text><rect x="695" y="84" width="240" height="150" rx="14" class="b y"/><text x="720" y="120" class="h">법정 예외</text><text x="720" y="153" class="s">갱신거절사유 등</text><text x="720" y="180" class="s">정당한 사유 확인</text><text x="40" y="275" class="s">권리금 자체를 임대인이 지급하는 제도가 아니라, 임차인의 회수기회를 부당하게 방해하지 못하게 하는 제도입니다.</text></svg>