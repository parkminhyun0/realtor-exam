<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}.y{fill:#fff7df}</style><text x="40" y="42" class="t">집합건물 기본 구조</text><rect x="45" y="82" width="275" height="155" rx="14" class="b a"/><text x="70" y="120" class="h">전유부분</text><text x="70" y="152" class="s">구분소유권의 목적</text><text x="70" y="180" class="s">독립하여 사용 가능한 건물부분</text><rect x="352" y="82" width="275" height="155" rx="14" class="b g"/><text x="377" y="120" class="h">공용부분</text><text x="377" y="152" class="s">구분소유자 전원의 공유</text><text x="377" y="180" class="s">일부공용부분은 일부 공유 가능</text><rect x="659" y="82" width="275" height="155" rx="14" class="b y"/><text x="684" y="120" class="h">대지사용권</text><text x="684" y="152" class="s">건물 대지를 사용할 권리</text><text x="684" y="180" class="s">원칙적으로 전유부분 처분에 따름</text><text x="40" y="278" class="s">시험 핵심: 전유부분·공용부분·대지사용권을 각각 구별한 뒤 처분의 일체성을 연결합니다.</text></svg>