<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;fill:#24384f}.t{font-size:30px;font-weight:800}.h{font-size:22px;font-weight:800}.b{font-size:17px}.s{font-size:15px;fill:#66788a}.box{fill:#fff;stroke:#d3dde7;stroke-width:2}.red{fill:#fff3f2;stroke:#c87870}.blue{fill:#eef5fb;stroke:#6d8faf}.green{fill:#eff8f2;stroke:#72a084}.gold{fill:#fff8e8;stroke:#caa65a}</style><text x="60" y="55" class="t">무효와 취소 · 민법 제137조~제146조</text><rect x="70" y="105" width="490" height="320" rx="20" class="red"/><text x="315" y="150" text-anchor="middle" class="h">무효</text><text x="105" y="205" class="b">출발점</text><text x="105" y="235" class="s">처음부터 법률효과 없음</text><text x="105" y="290" class="b">추인</text><text x="105" y="320" class="s">제139조: 원칙 효력 생기지 않음</text><text x="105" y="350" class="s">무효를 알고 추인 → 새로운 법률행위</text><text x="105" y="395" class="b">일부무효</text><text x="260" y="395" class="s">제137조: 원칙 전부무효 / 예외 나머지 유효</text><rect x="640" y="105" width="490" height="320" rx="20" class="blue"/><text x="885" y="150" text-anchor="middle" class="h">취소</text><text x="675" y="205" class="b">취소 전</text><text x="675" y="235" class="s">잠정적으로 유효</text><text x="675" y="290" class="b">취소 후</text><text x="675" y="320" class="s">제141조: 처음부터 무효인 것으로 봄</text><text x="675" y="350" class="s">취소권자·상대방·기간을 별도 확인</text><text x="675" y="395" class="b">기간</text><text x="790" y="395" class="s">제146조: 추인가능일 3년 / 행위일 10년</text><rect x="70" y="465" width="330" height="110" rx="16" class="gold"/><text x="235" y="502" text-anchor="middle" class="h">제138조 전환</text><text x="235" y="535" text-anchor="middle" class="s">다른 법률행위의 요건 + 가정적 의사</text><rect x="435" y="465" width="330" height="110" rx="16" class="green"/><text x="600" y="502" text-anchor="middle" class="h">제143·144조 추인</text><text x="600" y="535" text-anchor="middle" class="s">취소원인 소멸 후 → 더 이상 취소 불가</text><rect x="800" y="465" width="330" height="110" rx="16" class="blue"/><text x="965" y="502" text-anchor="middle" class="h">제145조 법정추인</text><text x="965" y="530" text-anchor="middle" class="s">이행·이행청구·경개·담보·양도·강제집행</text><text x="965" y="552" text-anchor="middle" class="s">단, 이의 보류 시 제외</text></svg>