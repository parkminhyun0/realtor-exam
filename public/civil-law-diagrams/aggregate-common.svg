<svg xmlns="http://www.w3.org/2000/svg" width="980" height="315" viewBox="0 0 980 315"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}.y{fill:#fff7df}</style><text x="40" y="42" class="t">공용부분의 귀속 · 지분 · 관리</text><rect x="45" y="82" width="275" height="150" rx="14" class="b a"/><text x="70" y="120" class="h">귀속</text><text x="70" y="152" class="s">원칙: 구분소유자 전원 공유</text><text x="70" y="180" class="s">일부공용부분: 해당자 공유</text><rect x="352" y="82" width="275" height="150" rx="14" class="b g"/><text x="377" y="120" class="h">지분</text><text x="377" y="152" class="s">원칙: 전유부분 면적 비율</text><text x="377" y="180" class="s">규약의 별도 정함 확인</text><rect x="659" y="82" width="275" height="150" rx="14" class="b y"/><text x="684" y="120" class="h">관리</text><text x="684" y="152" class="s">관리사항: 관리단집회 결의</text><text x="684" y="180" class="s">보존행위: 각 공유자 가능</text><text x="40" y="275" class="s">공유물 일반규정과 달리 집합건물법의 특별규정을 우선 확인합니다.</text></svg>