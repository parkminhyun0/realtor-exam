<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;fill:#24384f}.t{font-size:30px;font-weight:800}.h{font-size:21px;font-weight:800}.b{font-size:17px}.s{font-size:15px;fill:#66788a}.box{fill:#fff;stroke:#d4dee8;stroke-width:2}.blue{fill:#eef5fb;stroke:#6e8faf}.green{fill:#eff8f2;stroke:#72a084}.gold{fill:#fff8e8;stroke:#caa65a}</style><text x="60" y="55" class="t">표현대리 3종 비교 · 제125조 / 제126조 / 제129조</text><rect x="60" y="105" width="340" height="400" rx="20" class="blue"/><text x="230" y="145" text-anchor="middle" class="h">제125조</text><text x="230" y="176" text-anchor="middle" class="b">대리권수여 표시</text><text x="90" y="230" class="h">외관</text><text x="90" y="260" class="s">본인이 대리권 수여를 표시</text><text x="90" y="315" class="h">행위</text><text x="90" y="345" class="s">표시된 범위 안의 행위</text><text x="90" y="400" class="h">제3자</text><text x="90" y="430" class="s">대리권 없음에 선의·무과실</text><rect x="430" y="105" width="340" height="400" rx="20" class="green"/><text x="600" y="145" text-anchor="middle" class="h">제126조</text><text x="600" y="176" text-anchor="middle" class="b">권한을 넘은 표현대리</text><text x="460" y="230" class="h">기본대리권</text><text x="460" y="260" class="s">실제 기본대리권 존재</text><text x="460" y="315" class="h">행위</text><text x="460" y="345" class="s">기본대리권 범위를 초과</text><text x="460" y="400" class="h">제3자</text><text x="460" y="430" class="s">권한 있다고 믿을 정당한 이유</text><rect x="800" y="105" width="340" height="400" rx="20" class="gold"/><text x="970" y="145" text-anchor="middle" class="h">제129조</text><text x="970" y="176" text-anchor="middle" class="b">대리권 소멸 후</text><text x="830" y="230" class="h">과거 대리권</text><text x="830" y="260" class="s">실제 대리권이 존재했다가 소멸</text><text x="830" y="315" class="h">행위</text><text x="830" y="345" class="s">소멸 뒤 종전 외관으로 거래</text><text x="830" y="400" class="h">제3자</text><text x="830" y="430" class="s">소멸사실에 선의·무과실</text><rect x="60" y="535" width="1080" height="48" rx="12" class="box"/><text x="600" y="566" text-anchor="middle" class="b">암기: 125 ‘표시’ / 126 ‘기본대리권 + 월권 + 정당한 이유’ / 129 ‘있던 대리권이 소멸’</text></svg>