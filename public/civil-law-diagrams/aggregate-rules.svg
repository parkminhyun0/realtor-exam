<svg xmlns="http://www.w3.org/2000/svg" width="980" height="315" viewBox="0 0 980 315"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.n{font-size:27px;font-weight:800;fill:#b42323}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}</style><text x="40" y="42" class="t">집합건물 규약의 설정 · 변경 · 폐지</text><rect x="90" y="85" width="340" height="150" rx="14" class="b a"/><text x="115" y="122" class="h">구분소유자 수</text><text x="115" y="169" class="n">3/4 이상</text><text x="470" y="165" class="n">+</text><rect x="550" y="85" width="340" height="150" rx="14" class="b g"/><text x="575" y="122" class="h">의결권</text><text x="575" y="169" class="n">3/4 이상</text><text x="40" y="275" class="s">둘 다 충족해야 합니다. 일부 구분소유자의 권리에 특별한 영향을 미치면 그 구분소유자의 승낙도 확인합니다.</text></svg>