<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.n{font-size:24px;font-weight:800;fill:#b42323}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}.y{fill:#fff7df}</style><text x="40" y="42" class="t">상가임대차 기간 · 갱신 · 연체</text><rect x="50" y="82" width="260" height="150" rx="14" class="b a"/><text x="75" y="118" class="h">최소 보호기간</text><text x="75" y="160" class="n">1년</text><text x="75" y="192" class="s">임차인은 짧은 약정 주장 가능</text><rect x="360" y="82" width="260" height="150" rx="14" class="b g"/><text x="385" y="118" class="h">계약갱신요구권</text><text x="385" y="160" class="n">전체 10년</text><text x="385" y="192" class="s">최초 임대차기간 포함</text><rect x="670" y="82" width="260" height="150" rx="14" class="b y"/><text x="695" y="118" class="h">차임연체</text><text x="695" y="160" class="n">3기</text><text x="695" y="190" class="s">갱신거절 사유 +</text><text x="695" y="214" class="s">계약해지 가능</text><text x="40" y="276" class="s">주택의 최소 2년·갱신요구 1회와 상가의 최소 1년·전체 10년을 반드시 구별합니다.</text></svg>