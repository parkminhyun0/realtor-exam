<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400"><rect width="1120" height="400" rx="28" fill="#fafbfc"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#2d4054">저당권 사례문제 판단순서</text><rect x="56" y="108" width="205" height="100" rx="16" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="82" y="147" font-family="sans-serif" font-size="18" font-weight="700" fill="#315f8f">① 설정·등기</text><text x="82" y="180" font-family="sans-serif" font-size="14" fill="#4b5f73">피담보채권 확인</text><path d="M261 158 H306" stroke="#75879a" stroke-width="4"/><polygon points="306,158 292,150 292,166" fill="#75879a"/><rect x="306" y="108" width="205" height="100" rx="16" fill="#eaf5ef" stroke="#316d63" stroke-width="2"/><text x="332" y="147" font-family="sans-serif" font-size="18" font-weight="700" fill="#316d63">② 효력범위</text><text x="332" y="180" font-family="sans-serif" font-size="14" fill="#4b625c">부합물·종물·채권</text><path d="M511 158 H556" stroke="#75879a" stroke-width="4"/><polygon points="556,158 542,150 542,166" fill="#75879a"/><rect x="556" y="108" width="205" height="100" rx="16" fill="#fff7e8" stroke="#c2953e" stroke-width="2"/><text x="582" y="147" font-family="sans-serif" font-size="18" font-weight="700" fill="#806327">③ 제3자</text><text x="582" y="180" font-family="sans-serif" font-size="14" fill="#685c42">용익권·제3취득자</text><path d="M761 158 H806" stroke="#75879a" stroke-width="4"/><polygon points="806,158 792,150 792,166" fill="#75879a"/><rect x="806" y="108" width="258" height="100" rx="16" fill="#fff1f1" stroke="#b7584f" stroke-width="2"/><text x="832" y="147" font-family="sans-serif" font-size="18" font-weight="700" fill="#9e3e36">④ 실행·배당</text><text x="832" y="180" font-family="sans-serif" font-size="14" fill="#684f4d">경매 · 공동저당 · 대위</text><rect x="56" y="252" width="1008" height="72" rx="16" fill="#fff" stroke="#d4dce4"/><text x="84" y="286" font-family="sans-serif" font-size="17" font-weight="700" fill="#b42323">법정지상권이 보이면 제366조 요건을 별도로 확인</text><text x="84" y="314" font-family="sans-serif" font-size="16" fill="#556574">근저당이면 채권최고액과 실제 확정채권액을 같은 것으로 보지 않음</text></svg>