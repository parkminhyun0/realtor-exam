<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;fill:#24384f}.t{font-size:30px;font-weight:800}.h{font-size:22px;font-weight:800}.b{font-size:17px}.s{font-size:15px;fill:#66788a}.box{fill:#fff;stroke:#d3dde7;stroke-width:2}.blue{fill:#eef5fb;stroke:#6d8faf}.green{fill:#eff8f2;stroke:#72a084}.red{fill:#fff3f2;stroke:#c87870}.gold{fill:#fff8e8;stroke:#caa65a}.line{stroke:#8599ad;stroke-width:3;fill:none}.arrow{marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8599ad"/></marker></defs><text x="60" y="55" class="t">토지거래허가구역 계약 · 법령 + 판례 판단 흐름</text><rect x="70" y="105" width="300" height="100" rx="18" class="blue"/><text x="220" y="145" text-anchor="middle" class="h">허가대상 계약</text><text x="220" y="177" text-anchor="middle" class="s">소유권·지상권의 유상 이전·설정</text><path d="M370 155 H465" class="line arrow"/><rect x="465" y="105" width="300" height="100" rx="18" class="gold"/><text x="615" y="145" text-anchor="middle" class="h">당사자 공동 허가신청</text><text x="615" y="177" text-anchor="middle" class="s">부동산거래신고법 제11조</text><path d="M765 155 H860" class="line arrow"/><rect x="860" y="105" width="270" height="100" rx="18" class="red"/><text x="995" y="145" text-anchor="middle" class="h">허가 전 계약</text><text x="995" y="177" text-anchor="middle" class="s">판례상 유동적 무효</text><path d="M995 205 V285" class="line"/><path d="M995 285 H380" class="line"/><path d="M380 285 V330" class="line arrow"/><path d="M995 285 V330" class="line arrow"/><rect x="210" y="330" width="340" height="135" rx="18" class="green"/><text x="380" y="370" text-anchor="middle" class="h">허가</text><text x="380" y="402" text-anchor="middle" class="b">계약은 소급하여 유효</text><text x="380" y="430" text-anchor="middle" class="s">권리이전·이행 단계로 진행</text><rect x="825" y="330" width="340" height="135" rx="18" class="red"/><text x="995" y="370" text-anchor="middle" class="h">불허가 / 확정적 무효</text><text x="995" y="402" text-anchor="middle" class="b">계약효력 확정적으로 부정</text><text x="995" y="430" text-anchor="middle" class="s">부당이득 반환 등 후속관계 검토</text><rect x="210" y="510" width="955" height="75" rx="15" class="box"/><text x="687" y="540" text-anchor="middle" class="b">유동적 무효 중 핵심</text><text x="687" y="568" text-anchor="middle" class="s">계약상 이행청구는 할 수 없지만, 당사자에게는 허가신청 협력의무가 인정된다는 판례법리를 구별</text></svg>