<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.n{font-size:19px;font-weight:800;fill:#b42323}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}</style><text x="40" y="42" class="t">상가건물 임대차보호법 적용범위</text><rect x="40" y="78" width="260" height="170" rx="14" class="b a"/><text x="65" y="115" class="h">① 상가건물 임대차</text><text x="65" y="147" class="s">사업자등록 대상 건물</text><text x="65" y="174" class="s">실제 영업용도 확인</text><text x="325" y="165" class="h">→</text><rect x="370" y="78" width="275" height="170" rx="14" class="b g"/><text x="395" y="115" class="h">② 환산보증금</text><text x="395" y="148" class="n">보증금 + 월차임×100</text><text x="395" y="180" class="s">서울 9억 / 수도권·부산 6.9억</text><text x="395" y="205" class="s">광역시 등 5.4억 / 기타 3.7억</text><text x="670" y="165" class="h">→</text><rect x="715" y="78" width="225" height="170" rx="14" class="b"/><text x="740" y="115" class="h">③ 보호규정 확인</text><text x="740" y="148" class="s">대항력·갱신·권리금 등</text><text x="740" y="175" class="s">초과 임대차에도</text><text x="740" y="201" class="s">일부 규정 별도 적용</text><text x="40" y="290" class="s">환산보증금 기준을 넘었다는 이유만으로 상가임대차보호법 전체가 배제된다고 단정하지 않습니다.</text></svg>