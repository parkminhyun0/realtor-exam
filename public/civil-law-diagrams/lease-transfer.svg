<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#9fb3c6;stroke-width:2}.a{fill:#eef5fb}.b{fill:#fff5e9}.c{fill:#eef8f2}.line{stroke:#71869a;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71869a"/></marker></defs><text x="40" y="40" class="t">임차권 양도·전대 판단</text><rect x="50" y="80" rx="14" width="245" height="175" class="box a"/><text x="72" y="116" class="h">임대인 동의?</text><text x="72" y="148" class="s">원칙: 동의 필요</text><text x="72" y="176" class="s">민법 제629조</text><rect x="365" y="80" rx="14" width="245" height="175" class="box b"/><text x="387" y="116" class="h">동의 있는 전대</text><text x="387" y="148" class="s">전차인 → 임대인 직접 의무</text><text x="387" y="176" class="s">합의종료만으로 전차권 소멸 ×</text><text x="387" y="204" class="s">제630조·제631조</text><rect x="680" y="80" rx="14" width="245" height="175" class="box c"/><text x="702" y="116" class="h">무단 양도·전대</text><text x="702" y="148" class="s">조문상 해지 가능</text><text x="702" y="176" class="s">판례: 배신행위가 아닌 특별사정</text><text x="702" y="204" class="s">→ 해지 제한 가능</text><line x1="295" y1="168" x2="355" y2="168" class="line"/><line x1="610" y1="168" x2="670" y2="168" class="line"/><text x="50" y="306" class="s">시험순서: 임대인 동의 → 전대관계 → 해지 가능성 → 판례상 예외</text></svg>