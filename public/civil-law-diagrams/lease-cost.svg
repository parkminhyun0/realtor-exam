<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a0b3c5;stroke-width:2}.a{fill:#eef5fb}.b{fill:#fff5e9}</style><text x="40" y="40" class="t">임차인의 비용상환청구권</text><rect x="70" y="82" rx="14" width="390" height="185" class="box a"/><text x="95" y="120" class="h">필요비</text><text x="95" y="153" class="s">임차물 보존을 위해 지출</text><text x="95" y="181" class="s">→ 임대인에게 즉시 상환청구</text><text x="95" y="209" class="s">민법 제626조 제1항</text><rect x="520" y="82" rx="14" width="390" height="185" class="box b"/><text x="545" y="120" class="h">유익비</text><text x="545" y="153" class="s">객관적 가치 증가를 위한 지출</text><text x="545" y="181" class="s">종료시 가치증가 현존 필요</text><text x="545" y="209" class="s">임대인 선택: 지출액 또는 증가액</text><text x="40" y="306" class="s">시험 핵심: 필요비는 ‘즉시’, 유익비는 ‘종료시 + 가치증가 현존’을 구별합니다.</text></svg>