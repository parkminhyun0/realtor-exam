<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;fill:#24384f}.t{font-size:30px;font-weight:800}.h{font-size:21px;font-weight:800}.b{font-size:17px}.s{font-size:15px;fill:#66788a}.box{fill:#fff;stroke:#d3dde7;stroke-width:2}.blue{fill:#eef5fb;stroke:#6d8faf}.red{fill:#fff3f2;stroke:#c87870}.green{fill:#eff8f2;stroke:#72a084}.gold{fill:#fff8e8;stroke:#caa65a}.line{stroke:#8599ad;stroke-width:3;fill:none}.arrow{marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8599ad"/></marker></defs><text x="60" y="55" class="t">계약의 무권대리 · 제130조~제135조</text><rect x="420" y="95" width="360" height="90" rx="18" class="red"/><text x="600" y="132" text-anchor="middle" class="h">무권대리 계약</text><text x="600" y="162" text-anchor="middle" class="b">본인에게 효력 없음 · 제130조</text><path d="M600 185 V245" class="line arrow"/><rect x="70" y="260" width="300" height="120" rx="18" class="blue"/><text x="220" y="300" text-anchor="middle" class="h">본인의 추인</text><text x="220" y="332" text-anchor="middle" class="s">제133조: 원칙 계약시로 소급</text><text x="220" y="355" text-anchor="middle" class="s">제3자 권리는 침해하지 못함</text><rect x="450" y="260" width="300" height="120" rx="18" class="gold"/><text x="600" y="300" text-anchor="middle" class="h">상대방의 최고</text><text x="600" y="332" text-anchor="middle" class="s">제131조: 상당한 기간 설정</text><text x="600" y="355" text-anchor="middle" class="s">침묵 = 추인 거절</text><rect x="830" y="260" width="300" height="120" rx="18" class="green"/><text x="980" y="300" text-anchor="middle" class="h">상대방의 철회</text><text x="980" y="332" text-anchor="middle" class="s">제134조: 추인 전 철회 가능</text><text x="980" y="355" text-anchor="middle" class="s">대리권 없음을 안 경우 제외</text><path d="M420 140 C300 170 250 210 220 260" class="line arrow"/><path d="M600 185 V260" class="line arrow"/><path d="M780 140 C900 170 950 210 980 260" class="line arrow"/><rect x="160" y="455" width="880" height="120" rx="20" class="box"/><text x="600" y="492" text-anchor="middle" class="h">본인의 추인이 없고 대리권도 증명하지 못하면 · 제135조</text><text x="600" y="527" text-anchor="middle" class="b">상대방 선택 → 계약 이행 책임 또는 손해배상 책임</text><text x="600" y="555" text-anchor="middle" class="s">다만 상대방이 대리권 없음을 알았거나 알 수 있었던 때, 무권대리인이 제한능력자인 때는 제외</text><rect x="160" y="595" width="880" height="35" rx="10" class="red"/><text x="600" y="619" text-anchor="middle" class="s">시험 함정: ‘본인의 침묵 = 추인’이 아니라 최고기간 내 침묵은 ‘추인 거절’</text></svg>