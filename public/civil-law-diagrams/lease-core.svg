<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#9fb3c6;stroke-width:2}.a{fill:#eef5fb}.b{fill:#fff5e9}.c{fill:#eef8f2}.arrow{stroke:#71869a;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71869a"/></marker></defs><text x="40" y="40" class="t">임대차 기본 법률관계</text><rect x="55" y="85" rx="14" width="280" height="180" class="box a"/><text x="78" y="122" class="h">임대인</text><text x="78" y="154" class="s">목적물 인도</text><text x="78" y="181" class="s">사용·수익 가능한 상태 유지</text><text x="78" y="208" class="s">필요한 수선·보존</text><rect x="645" y="85" rx="14" width="280" height="180" class="box b"/><text x="668" y="122" class="h">임차인</text><text x="668" y="154" class="s">차임 지급</text><text x="668" y="181" class="s">이상·권리주장 통지</text><text x="668" y="208" class="s">종료 시 반환·원상회복</text><rect x="375" y="110" rx="14" width="230" height="130" class="box c"/><text x="398" y="147" class="h">임대차계약</text><text x="398" y="179" class="s">사용·수익 ↔ 차임</text><text x="398" y="206" class="s">계속적 쌍무계약</text><line x1="335" y1="175" x2="365" y2="175" class="arrow"/><line x1="605" y1="175" x2="635" y2="175" class="arrow"/><text x="55" y="310" class="s">핵심 근거: 민법 제618조·제623조·제633조·제634조·제654조</text></svg>