<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;fill:#24384f}.t{font-size:30px;font-weight:800}.h{font-size:21px;font-weight:800}.b{font-size:17px}.s{font-size:15px;fill:#66788a}.box{fill:#fff;stroke:#d3dde7;stroke-width:2}.blue{fill:#eef5fb;stroke:#6d8faf}.red{fill:#fff3f2;stroke:#c87870}.green{fill:#eff8f2;stroke:#72a084}.gold{fill:#fff8e8;stroke:#caa65a}</style><text x="60" y="55" class="t">의사표시 4대 유형 비교 · 민법 제107조~제110조</text><rect x="60" y="100" width="260" height="430" rx="18" class="blue"/><text x="190" y="140" text-anchor="middle" class="h">비진의표시 · 제107조</text><text x="85" y="188" class="b">표의자</text><text x="85" y="218" class="s">진의 아님을 알고 표시</text><text x="85" y="270" class="b">원칙</text><text x="85" y="300" class="s">유효</text><text x="85" y="352" class="b">상대방</text><text x="85" y="382" class="s">악의 또는 과실 → 무효</text><text x="85" y="434" class="b">제3자</text><text x="85" y="464" class="s">선의 제3자 보호</text><rect x="340" y="100" width="260" height="430" rx="18" class="red"/><text x="470" y="140" text-anchor="middle" class="h">통정허위 · 제108조</text><text x="365" y="188" class="b">당사자</text><text x="365" y="218" class="s">서로 통정해 허위 외관 형성</text><text x="365" y="270" class="b">당사자 사이</text><text x="365" y="300" class="s">무효</text><text x="365" y="352" class="b">제3자</text><text x="365" y="382" class="s">선의이면 보호</text><text x="365" y="434" class="b">무과실</text><text x="365" y="464" class="s">조문상 요구 없음</text><rect x="620" y="100" width="260" height="430" rx="18" class="gold"/><text x="750" y="140" text-anchor="middle" class="h">착오 · 제109조</text><text x="645" y="188" class="b">요건</text><text x="645" y="218" class="s">내용 중요부분 착오</text><text x="645" y="270" class="b">효과</text><text x="645" y="300" class="s">취소 가능</text><text x="645" y="352" class="b">중대한 과실</text><text x="645" y="382" class="s">원칙적으로 취소 불가</text><text x="645" y="434" class="b">제3자</text><text x="645" y="464" class="s">선의 제3자 보호</text><rect x="900" y="100" width="260" height="430" rx="18" class="green"/><text x="1030" y="140" text-anchor="middle" class="h">사기·강박 · 제110조</text><text x="925" y="188" class="b">상대방 사기·강박</text><text x="925" y="218" class="s">취소 가능</text><text x="925" y="270" class="b">제3자 사기·강박</text><text x="925" y="300" class="s">상대방 악의·과실 필요</text><text x="925" y="352" class="b">제3자 보호</text><text x="925" y="382" class="s">선의 제3자 보호</text><text x="925" y="434" class="b">효과</text><text x="925" y="464" class="s">무효가 아니라 취소</text><rect x="60" y="560" width="1100" height="50" rx="13" class="box"/><text x="610" y="592" text-anchor="middle" class="b">시험 핵심: 제107·108은 ‘무효’ 구조, 제109·110은 ‘취소’ 구조 / 제3자 보호 문언을 정확히 구별</text></svg>