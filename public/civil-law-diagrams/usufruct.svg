<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450"><rect width="1120" height="450" rx="28" fill="#f8faf9"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#24483f">용익물권 비교</text><rect x="56" y="100" width="310" height="250" rx="20" fill="#eaf5ef" stroke="#316d63" stroke-width="2"/><text x="84" y="142" font-family="sans-serif" font-size="22" font-weight="700" fill="#316d63">지상권</text><text x="84" y="181" font-family="sans-serif" font-size="17" fill="#4a625c">타인의 토지 사용</text><text x="84" y="215" font-family="sans-serif" font-size="17" fill="#4a625c">건물·공작물·수목 소유 목적</text><text x="84" y="249" font-family="sans-serif" font-size="17" fill="#4a625c">물권 · 양도/임대 가능</text><text x="84" y="283" font-family="sans-serif" font-size="17" fill="#4a625c">최단기간 30·15·5년</text><rect x="405" y="100" width="310" height="250" rx="20" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="433" y="142" font-family="sans-serif" font-size="22" font-weight="700" fill="#315f8f">지역권</text><text x="433" y="181" font-family="sans-serif" font-size="17" fill="#4a5e72">요역지의 편익을 위해</text><text x="433" y="215" font-family="sans-serif" font-size="17" fill="#4a5e72">승역지를 이용</text><text x="433" y="249" font-family="sans-serif" font-size="17" fill="#4a5e72">요역지에 부종</text><text x="433" y="283" font-family="sans-serif" font-size="17" fill="#4a5e72">불가분성</text><rect x="754" y="100" width="310" height="250" rx="20" fill="#fff7e8" stroke="#c2953e" stroke-width="2"/><text x="782" y="142" font-family="sans-serif" font-size="22" font-weight="700" fill="#806327">전세권</text><text x="782" y="181" font-family="sans-serif" font-size="17" fill="#685c42">전세금 지급 + 부동산 점유</text><text x="782" y="215" font-family="sans-serif" font-size="17" fill="#685c42">사용·수익</text><text x="782" y="249" font-family="sans-serif" font-size="17" fill="#685c42">우선변제권</text><text x="782" y="283" font-family="sans-serif" font-size="17" fill="#685c42">농경지는 목적물 불가</text><text x="56" y="402" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">구별순서: 목적 → 대상 → 성립(등기) → 양도가능성 → 소멸·매수청구 → 담보적 효력</text></svg>