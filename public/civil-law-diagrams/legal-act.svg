<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;fill:#24384f}.t{font-size:30px;font-weight:800}.h{font-size:22px;font-weight:800}.b{font-size:18px}.s{font-size:16px;fill:#66788a}.box{fill:#fff;stroke:#d5dee8;stroke-width:2}.blue{fill:#edf5fc;stroke:#6a8eaf}.red{fill:#fff2f1;stroke:#c77269}.green{fill:#eff8f2;stroke:#73a184}.line{stroke:#8da2b5;stroke-width:3;fill:none}.arrow{marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8da2b5"/></marker></defs><text x="60" y="55" class="t">법률행위 · 성립요건과 효력요건</text><rect x="70" y="100" width="280" height="110" rx="18" class="blue"/><text x="210" y="140" text-anchor="middle" class="h">① 성립</text><text x="210" y="172" text-anchor="middle" class="b">당사자 · 목적 · 의사표시</text><path d="M350 155 H455" class="line arrow"/><rect x="455" y="100" width="280" height="110" rx="18" class="green"/><text x="595" y="140" text-anchor="middle" class="h">② 효력요건</text><text x="595" y="172" text-anchor="middle" class="b">능력 · 목적 · 의사표시 하자</text><path d="M735 155 H840" class="line arrow"/><rect x="840" y="100" width="280" height="110" rx="18" class="red"/><text x="980" y="140" text-anchor="middle" class="h">③ 위반효과</text><text x="980" y="172" text-anchor="middle" class="b">무효 · 취소 · 유효</text><text x="70" y="275" class="h">목적의 4단계 검사</text><rect x="70" y="310" width="240" height="90" rx="16" class="box"/><text x="190" y="347" text-anchor="middle" class="h">확정성</text><text x="190" y="376" text-anchor="middle" class="s">무엇을 할지 특정 가능?</text><rect x="345" y="310" width="240" height="90" rx="16" class="box"/><text x="465" y="347" text-anchor="middle" class="h">가능성</text><text x="465" y="376" text-anchor="middle" class="s">실현 가능한가?</text><rect x="620" y="310" width="240" height="90" rx="16" class="box"/><text x="740" y="347" text-anchor="middle" class="h">적법성</text><text x="740" y="376" text-anchor="middle" class="s">강행규정 위반인가?</text><rect x="895" y="310" width="240" height="90" rx="16" class="box"/><text x="1015" y="347" text-anchor="middle" class="h">사회적 타당성</text><text x="1015" y="376" text-anchor="middle" class="s">민법 제103조 위반?</text><rect x="70" y="455" width="320" height="90" rx="16" class="red"/><text x="230" y="490" text-anchor="middle" class="h">제103조</text><text x="230" y="520" text-anchor="middle" class="b">반사회질서 → 무효</text><rect x="440" y="455" width="320" height="90" rx="16" class="red"/><text x="600" y="490" text-anchor="middle" class="h">제104조</text><text x="600" y="520" text-anchor="middle" class="b">불공정한 법률행위 → 무효</text><rect x="810" y="455" width="320" height="90" rx="16" class="blue"/><text x="970" y="490" text-anchor="middle" class="h">제105조</text><text x="970" y="520" text-anchor="middle" class="b">임의규정 → 당사자 의사 우선</text></svg>