<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a0b3c5;stroke-width:2}.a{fill:#eef5fb}.b{fill:#fff5e9}.c{fill:#fff0ee}.arrow{stroke:#71869a;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71869a"/></marker></defs><text x="40" y="40" class="t">임대인의 유지·수선의무와 보존행위</text><rect x="40" y="80" rx="14" width="260" height="170" class="box a"/><text x="62" y="116" class="h">제623조</text><text x="62" y="148" class="s">목적물 인도</text><text x="62" y="176" class="s">계약존속 중 사용·수익에</text><text x="62" y="202" class="s">필요한 상태 유지</text><rect x="360" y="80" rx="14" width="260" height="170" class="box b"/><text x="382" y="116" class="h">제624조</text><text x="382" y="148" class="s">보존에 필요한 행위</text><text x="382" y="176" class="s">→ 임차인은 원칙적으로</text><text x="382" y="202" class="s">이를 거절하지 못함</text><rect x="680" y="80" rx="14" width="260" height="170" class="box c"/><text x="702" y="116" class="h">제625조 예외</text><text x="702" y="148" class="s">임차인 의사에 반한 보존행위로</text><text x="702" y="176" class="s">임차 목적 달성 불가능</text><text x="702" y="202" class="s">→ 임차인은 계약 해지 가능</text><line x1="300" y1="165" x2="350" y2="165" class="arrow"/><line x1="620" y1="165" x2="670" y2="165" class="arrow"/><text x="40" y="300" class="s">판단순서: 수선·보존 필요성 → 임차인의 인용의무 → 목적 달성 불가능 여부</text></svg>