<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430"><rect width="1120" height="430" rx="28" fill="#fbfaf7"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#4b3b2b">부동산 취득시효 20년 ↔ 10년</text><rect x="56" y="100" width="470" height="230" rx="20" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="86" y="144" font-family="sans-serif" font-size="23" font-weight="700" fill="#315f8f">점유취득시효 · 제245조①</text><text x="86" y="185" font-family="sans-serif" font-size="18" fill="#465a70">20년</text><text x="86" y="220" font-family="sans-serif" font-size="17" fill="#465a70">자주 + 평온 + 공연 점유</text><text x="86" y="255" font-family="sans-serif" font-size="17" fill="#465a70">선의·무과실은 요건 아님</text><text x="86" y="294" font-family="sans-serif" font-size="19" font-weight="700" fill="#b42323">등기함으로써 소유권 취득</text><rect x="594" y="100" width="470" height="230" rx="20" fill="#eaf5ef" stroke="#316d63" stroke-width="2"/><text x="624" y="144" font-family="sans-serif" font-size="23" font-weight="700" fill="#316d63">등기부취득시효 · 제245조②</text><text x="624" y="185" font-family="sans-serif" font-size="18" fill="#46625b">10년</text><text x="624" y="220" font-family="sans-serif" font-size="17" fill="#46625b">소유자로 등기 + 자주 + 평온 + 공연</text><text x="624" y="255" font-family="sans-serif" font-size="17" fill="#46625b">선의 + 무과실 필요</text><text x="624" y="294" font-family="sans-serif" font-size="19" font-weight="700" fill="#2f6757">기간 경과로 소유권 취득</text><rect x="56" y="350" width="1008" height="48" rx="14" fill="#fff3f3"/><text x="84" y="382" font-family="sans-serif" font-size="17" font-weight="700" fill="#b42323">제247조: 취득효과는 점유개시 시로 소급 · 완성 후 제3자 관계는 등기와 판례를 별도 판단</text></svg>