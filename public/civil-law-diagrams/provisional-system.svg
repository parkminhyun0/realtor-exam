<svg xmlns="http://www.w3.org/2000/svg" width="980" height="315" viewBox="0 0 980 315"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}.y{fill:#fff7df}</style><text x="40" y="42" class="t">가등기담보법 적용 판단</text><rect x="45" y="84" width="260" height="150" rx="14" class="b a"/><text x="70" y="120" class="h">① 형식</text><text x="70" y="152" class="s">가등기·소유권이전예약</text><text x="70" y="180" class="s">형식만으로 판단하지 않음</text><text x="330" y="160" class="h">→</text><rect x="375" y="84" width="260" height="150" rx="14" class="b g"/><text x="400" y="120" class="h">② 실질</text><text x="400" y="152" class="s">채권담보 목적?</text><text x="400" y="180" class="s">담보계약·채무액 확인</text><text x="660" y="160" class="h">→</text><rect x="705" y="84" width="230" height="150" rx="14" class="b y"/><text x="730" y="120" class="h">③ 특별법 적용</text><text x="730" y="152" class="s">청산절차 강제</text><text x="730" y="180" class="s">우선변제·경매 구조</text><text x="40" y="275" class="s">단순한 청구권보전 가등기와 채권담보 목적의 담보가등기를 구별하는 것이 출발점입니다.</text></svg>