<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}</style><text x="40" y="42" class="t">전유부분과 대지사용권의 일체성</text><rect x="80" y="90" width="260" height="125" rx="14" class="b a"/><text x="105" y="128" class="h">전유부분 처분</text><text x="105" y="160" class="s">매매·양도 등</text><text x="385" y="158" class="h">⇄ 함께 이동 ⇄</text><rect x="610" y="90" width="260" height="125" rx="14" class="b g"/><text x="635" y="128" class="h">대지사용권</text><text x="635" y="160" class="s">원칙적으로 처분에 따름</text><text x="40" y="260" class="s">원칙: 전유부분과 대지사용권 분리처분 금지. 다만 규약의 별도 정함 등 법정 예외를 확인합니다.</text></svg>