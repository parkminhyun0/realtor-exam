<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}</style><text x="40" y="42" class="t">주택임대차보호법 적용 판단</text><rect x="55" y="85" width="250" height="125" rx="14" class="b a"/><text x="80" y="122" class="h">① 주거용 건물?</text><text x="80" y="153" class="s">실제 용도 중심 판단</text><text x="80" y="180" class="s">일부 비주거 사용도 가능</text><text x="335" y="150" class="h">→</text><rect x="380" y="85" width="250" height="125" rx="14" class="b g"/><text x="405" y="122" class="h">② 인도·주민등록</text><text x="405" y="153" class="s">대항력 요건</text><text x="405" y="180" class="s">다음 날 효력</text><text x="660" y="150" class="h">→</text><rect x="705" y="85" width="220" height="125" rx="14" class="b"/><text x="730" y="122" class="h">③ 특별법 보호</text><text x="730" y="153" class="s">기간·갱신·보증금</text><text x="730" y="180" class="s">강행규정 확인</text><text x="40" y="260" class="s">시험순서: 적용대상 → 대항요건 → 우선변제·기간·갱신을 분리합니다.</text></svg>