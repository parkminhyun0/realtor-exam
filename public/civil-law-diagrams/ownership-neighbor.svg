<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380"><rect width="1120" height="380" rx="28" fill="#fafbfc"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#344453">상린관계 · 주위토지통행권</text><rect x="56" y="110" width="310" height="170" rx="20" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="84" y="152" font-family="sans-serif" font-size="21" font-weight="700" fill="#315f8f">상린관계</text><text x="84" y="191" font-family="sans-serif" font-size="17" fill="#4b5f73">인접 토지 이용의 충돌 조정</text><text x="84" y="225" font-family="sans-serif" font-size="17" fill="#4b5f73">통행 · 유수 · 경계 · 건축</text><rect x="405" y="110" width="310" height="170" rx="20" fill="#eaf5ef" stroke="#316d63" stroke-width="2"/><text x="433" y="152" font-family="sans-serif" font-size="21" font-weight="700" fill="#316d63">제219조 일반형</text><text x="433" y="191" font-family="sans-serif" font-size="17" fill="#4b625c">공로 출입에 필요한 통로 없음</text><text x="433" y="225" font-family="sans-serif" font-size="17" fill="#4b625c">손해가 가장 적은 장소·방법</text><text x="433" y="257" font-family="sans-serif" font-size="17" fill="#4b625c">원칙적 손해 보상</text><rect x="754" y="110" width="310" height="170" rx="20" fill="#fff7e8" stroke="#c2953e" stroke-width="2"/><text x="782" y="152" font-family="sans-serif" font-size="21" font-weight="700" fill="#806327">제220조 분할형</text><text x="782" y="191" font-family="sans-serif" font-size="17" fill="#685c42">분할로 공로에 못 나감</text><text x="782" y="225" font-family="sans-serif" font-size="17" fill="#685c42">다른 분할자 토지 통행</text><text x="782" y="257" font-family="sans-serif" font-size="17" font-weight="700" fill="#b42323">보상의무 없음</text><text x="56" y="329" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">시험 포인트: 일반 맹지인지 ‘분할로 생긴 맹지’인지 먼저 구별</text></svg>