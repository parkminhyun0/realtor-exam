<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390"><rect width="1120" height="390" rx="28" fill="#fafbfc"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#314252">물권의 소멸 판단</text><rect x="56" y="105" width="230" height="165" rx="18" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="84" y="145" font-family="sans-serif" font-size="20" font-weight="700" fill="#315f8f">목적물 멸실</text><text x="84" y="184" font-family="sans-serif" font-size="16" fill="#4a5e72">권리객체 소멸</text><rect x="315" y="105" width="230" height="165" rx="18" fill="#eaf5ef" stroke="#316d63" stroke-width="2"/><text x="343" y="145" font-family="sans-serif" font-size="20" font-weight="700" fill="#316d63">포기</text><text x="343" y="184" font-family="sans-serif" font-size="16" fill="#4a625c">권리자가 권리 포기</text><rect x="574" y="105" width="230" height="165" rx="18" fill="#fff7e8" stroke="#c2953e" stroke-width="2"/><text x="602" y="145" font-family="sans-serif" font-size="20" font-weight="700" fill="#806327">혼동</text><text x="602" y="184" font-family="sans-serif" font-size="16" fill="#685c42">제191조</text><text x="602" y="216" font-family="sans-serif" font-size="16" fill="#685c42">소유권과 제한물권 동일인 귀속</text><rect x="833" y="105" width="230" height="165" rx="18" fill="#fff1f1" stroke="#b7584f" stroke-width="2"/><text x="861" y="145" font-family="sans-serif" font-size="20" font-weight="700" fill="#9e3e36">부종성</text><text x="861" y="184" font-family="sans-serif" font-size="16" fill="#684f4d">제369조</text><text x="861" y="216" font-family="sans-serif" font-size="16" fill="#684f4d">피담보채권 소멸 → 저당권 소멸</text><text x="56" y="333" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">예외: 혼동이 생겨도 그 물권 또는 그 물권을 목적으로 하는 제3자의 권리가 있으면 제191조 예외 확인</text></svg>