<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400"><rect width="1120" height="400" rx="28" fill="#f8faf9"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#24483f">점유자 ↔ 회복자</text><rect x="56" y="105" width="300" height="190" rx="20" fill="#eaf5ef" stroke="#316d63" stroke-width="2"/><text x="84" y="147" font-family="sans-serif" font-size="21" font-weight="700" fill="#316d63">과실 · 제201조</text><text x="84" y="187" font-family="sans-serif" font-size="17" fill="#4b625c">선의점유자 → 과실 취득</text><text x="84" y="222" font-family="sans-serif" font-size="17" fill="#4b625c">악의점유자 → 반환·보상</text><rect x="410" y="105" width="300" height="190" rx="20" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="438" y="147" font-family="sans-serif" font-size="21" font-weight="700" fill="#315f8f">멸실·훼손 · 제202조</text><text x="438" y="187" font-family="sans-serif" font-size="17" fill="#4b5f73">악의 → 전부배상</text><text x="438" y="222" font-family="sans-serif" font-size="17" fill="#4b5f73">선의 → 이익 현존 한도</text><rect x="764" y="105" width="300" height="190" rx="20" fill="#fff7e8" stroke="#c2953e" stroke-width="2"/><text x="792" y="147" font-family="sans-serif" font-size="21" font-weight="700" fill="#806327">비용 · 제203조</text><text x="792" y="187" font-family="sans-serif" font-size="17" fill="#685c42">필요비 → 보존비용</text><text x="792" y="222" font-family="sans-serif" font-size="17" fill="#685c42">유익비 → 가치증가 현존</text><text x="792" y="255" font-family="sans-serif" font-size="16" fill="#b42323">회복자의 선택 문제</text><text x="56" y="347" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">과실 · 멸실훼손 · 비용상환을 하나의 기준으로 풀지 말고 조문별로 분리</text></svg>