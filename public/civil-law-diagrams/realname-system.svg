<svg xmlns="http://www.w3.org/2000/svg" width="980" height="315" viewBox="0 0 980 315"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}.y{fill:#fff7df}</style><text x="40" y="42" class="t">부동산실명법 기본 구조</text><rect x="40" y="82" width="270" height="150" rx="14" class="b a"/><text x="65" y="118" class="h">원칙</text><text x="65" y="150" class="s">실권리자 명의로 등기</text><text x="65" y="178" class="s">명의신탁 등기 금지</text><text x="335" y="160" class="h">→</text><rect x="380" y="82" width="270" height="150" rx="14" class="b g"/><text x="405" y="118" class="h">명의신탁약정</text><text x="405" y="150" class="s">제4조: 약정 무효</text><text x="405" y="178" class="s">물권변동도 원칙적 무효</text><text x="675" y="160" class="h">→</text><rect x="720" y="82" width="220" height="150" rx="14" class="b y"/><text x="745" y="118" class="h">제3자·예외</text><text x="745" y="150" class="s">무효는 제3자에게</text><text x="745" y="176" class="s">대항하지 못함</text><text x="745" y="202" class="s">계약명의신탁 단서 확인</text><text x="40" y="275" class="s">먼저 제2조의 법정 제외유형을 걸러낸 뒤, 제3조·제4조의 무효원칙과 제8조 특례를 순서대로 봅니다.</text></svg>