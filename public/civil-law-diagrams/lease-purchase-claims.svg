<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a0b3c5;stroke-width:2}.a{fill:#eef5fb}.b{fill:#fff5e9}.c{fill:#eef8f2}.arrow{stroke:#71869a;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71869a"/></marker></defs><text x="40" y="40" class="t">임대차 종료 시 매수청구권</text><rect x="40" y="78" rx="14" width="270" height="185" class="box a"/><text x="62" y="115" class="h">토지임차인</text><text x="62" y="147" class="s">건물·공작물 소유 목적</text><text x="62" y="175" class="s">기간만료 + 지상물 현존</text><text x="62" y="203" class="s">→ 갱신청구</text><rect x="355" y="78" rx="14" width="270" height="185" class="box b"/><text x="377" y="115" class="h">임대인 갱신 거절</text><text x="377" y="147" class="s">→ 상당한 가액으로</text><text x="377" y="175" class="s">지상물 매수청구</text><text x="377" y="203" class="s">민법 제643조</text><rect x="670" y="78" rx="14" width="270" height="185" class="box c"/><text x="692" y="115" class="h">건물임차인</text><text x="692" y="147" class="s">동의받아 설치한 부속물</text><text x="692" y="175" class="s">또는 임대인에게서 매수</text><text x="692" y="203" class="s">→ 부속물매수청구 제646조</text><line x1="310" y1="170" x2="345" y2="170" class="arrow"/><text x="40" y="305" class="s">토지 지상물매수청구와 건물 부속물매수청구는 대상·요건이 다릅니다.</text></svg>