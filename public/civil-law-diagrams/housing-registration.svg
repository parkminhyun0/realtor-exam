<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}</style><text x="40" y="42" class="t">주택 임차권등기명령 흐름</text><rect x="45" y="88" width="200" height="110" rx="14" class="b a"/><text x="70" y="124" class="h">임대차 종료</text><text x="70" y="156" class="s">보증금 미반환</text><text x="270" y="148" class="h">→</text><rect x="315" y="88" width="200" height="110" rx="14" class="b"/><text x="340" y="124" class="h">법원 신청</text><text x="340" y="156" class="s">임차권등기명령</text><text x="540" y="148" class="h">→</text><rect x="585" y="88" width="150" height="110" rx="14" class="b g"/><text x="610" y="124" class="h">등기 완료</text><text x="610" y="156" class="s">공시 확보</text><text x="760" y="148" class="h">→</text><rect x="805" y="88" width="135" height="110" rx="14" class="b a"/><text x="825" y="124" class="h">이사 가능</text><text x="825" y="153" class="s">대항력·</text><text x="825" y="176" class="s">우선변제 보전</text><text x="40" y="252" class="s">핵심: 신청한 때가 아니라 임차권등기가 마쳐진 뒤의 법적 효과를 봅니다.</text></svg>