<svg xmlns="http://www.w3.org/2000/svg" width="980" height="310" viewBox="0 0 980 310"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a0b3c5;stroke-width:2}.a{fill:#eef5fb}.b{fill:#fff5e9}.line{stroke:#71869a;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71869a"/></marker></defs><text x="40" y="40" class="t">교환의 구조</text><rect x="100" y="90" rx="14" width="280" height="135" class="box a"/><text x="125" y="128" class="h">당사자 A</text><text x="125" y="160" class="s">금전 이외 재산권 이전</text><rect x="600" y="90" rx="14" width="280" height="135" class="box b"/><text x="625" y="128" class="h">당사자 B</text><text x="625" y="160" class="s">금전 이외 재산권 이전</text><line x1="380" y1="142" x2="590" y2="142" class="line"/><line x1="600" y1="182" x2="390" y2="182" class="line"/><text x="100" y="266" class="s">보충금이 있으면 그 금전에는 매매대금 규정 준용(민법 제597조)</text></svg>