<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#23364d}.t{font-size:23px;font-weight:700}.s{font-size:16px}.n{font-size:14px;fill:#66788b}.box{fill:#fff;stroke:#9db2c6;stroke-width:2}.a{fill:#edf5fb}.b{fill:#fff7ec}.c{fill:#eef8f2}.arrow{stroke:#6f8498;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6f8498"/></marker></defs><text x="40" y="42" class="t">약관이 계약내용이 되는 과정</text><rect x="40" y="80" rx="14" width="245" height="130" class="box a"/><text x="62" y="116" class="s">① 약관 마련</text><text x="62" y="145" class="n">다수 상대방과 계약하기 위해</text><text x="62" y="168" class="n">미리 정형화한 계약내용</text><rect x="365" y="80" rx="14" width="245" height="130" class="box b"/><text x="387" y="116" class="s">② 명시·설명</text><text x="387" y="145" class="n">계약체결 시 내용 제시</text><text x="387" y="168" class="n">중요내용은 이해 가능하게 설명</text><rect x="690" y="80" rx="14" width="245" height="130" class="box c"/><text x="712" y="116" class="s">③ 계약내용 편입</text><text x="712" y="145" class="n">의무 위반 시 해당 약관을</text><text x="712" y="168" class="n">계약내용으로 주장할 수 없음</text><line x1="285" y1="145" x2="355" y2="145" class="arrow"/><line x1="610" y1="145" x2="680" y2="145" class="arrow"/><text x="40" y="260" class="n">근거: 약관의 규제에 관한 법률 제2조·제3조</text></svg>