<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390"><rect width="1120" height="390" rx="28" fill="#f8fafc"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#2f4257">소유권에 기한 물권적 청구권</text><rect x="56" y="105" width="300" height="180" rx="20" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="84" y="147" font-family="sans-serif" font-size="22" font-weight="700" fill="#315f8f">반환청구</text><text x="84" y="188" font-family="sans-serif" font-size="17" fill="#4c6074">목적물을 점유당함</text><text x="84" y="222" font-family="sans-serif" font-size="17" fill="#4c6074">→ 제213조</text><text x="84" y="255" font-family="sans-serif" font-size="16" fill="#b42323">점유권원이 있으면 반환 거부 가능</text><rect x="410" y="105" width="300" height="180" rx="20" fill="#eaf5ef" stroke="#316d63" stroke-width="2"/><text x="438" y="147" font-family="sans-serif" font-size="22" font-weight="700" fill="#316d63">방해제거</text><text x="438" y="188" font-family="sans-serif" font-size="17" fill="#4b625c">현재 방해가 계속</text><text x="438" y="222" font-family="sans-serif" font-size="17" fill="#4b625c">→ 제214조</text><rect x="764" y="105" width="300" height="180" rx="20" fill="#fff7e8" stroke="#c2953e" stroke-width="2"/><text x="792" y="147" font-family="sans-serif" font-size="22" font-weight="700" fill="#806327">방해예방</text><text x="792" y="188" font-family="sans-serif" font-size="17" fill="#685c42">장래 방해의 염려</text><text x="792" y="222" font-family="sans-serif" font-size="17" fill="#685c42">→ 제214조</text><text x="56" y="337" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">구별: 물건을 돌려받나? 현재 방해를 없애나? 장래 위험을 막나?</text></svg>