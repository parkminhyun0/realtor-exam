<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420"><rect width="1120" height="420" rx="28" fill="#fafbfc"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#2d4054">저당권의 효력범위</text><rect x="56" y="105" width="300" height="200" rx="20" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="84" y="147" font-family="sans-serif" font-size="22" font-weight="700" fill="#315f8f">목적물 범위</text><text x="84" y="188" font-family="sans-serif" font-size="17" fill="#4b5f73">제358조</text><text x="84" y="222" font-family="sans-serif" font-size="17" fill="#4b5f73">저당부동산</text><text x="84" y="254" font-family="sans-serif" font-size="17" fill="#4b5f73">+ 부합물 + 종물</text><rect x="410" y="105" width="300" height="200" rx="20" fill="#eaf5ef" stroke="#316d63" stroke-width="2"/><text x="438" y="147" font-family="sans-serif" font-size="22" font-weight="700" fill="#316d63">채권 범위</text><text x="438" y="188" font-family="sans-serif" font-size="17" fill="#4b625c">제360조</text><text x="438" y="222" font-family="sans-serif" font-size="17" fill="#4b625c">원본 · 이자 · 위약금</text><text x="438" y="254" font-family="sans-serif" font-size="17" fill="#4b625c">손해배상 · 실행비용</text><text x="438" y="286" font-family="sans-serif" font-size="16" font-weight="700" fill="#b42323">지연배상은 1년분 한도</text><rect x="764" y="105" width="300" height="200" rx="20" fill="#fff7e8" stroke="#c2953e" stroke-width="2"/><text x="792" y="147" font-family="sans-serif" font-size="22" font-weight="700" fill="#806327">권리의 운명</text><text x="792" y="188" font-family="sans-serif" font-size="17" fill="#685c42">제361조</text><text x="792" y="222" font-family="sans-serif" font-size="17" fill="#685c42">피담보채권과 분리처분 ×</text><text x="792" y="254" font-family="sans-serif" font-size="17" fill="#685c42">제369조</text><text x="792" y="286" font-family="sans-serif" font-size="17" fill="#685c42">채권 소멸 → 저당권 소멸</text><text x="56" y="365" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">시험순서: 목적물 범위 → 피담보채권 범위 → 제3취득자 → 실행 → 소멸</text></svg>