<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#9eb2c5;stroke-width:2}.a{fill:#edf5fb}.b{fill:#fff6ea}.c{fill:#eef8f2}.line{stroke:#71869a;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71869a"/></marker></defs><text x="40" y="40" class="t">제3자를 위한 계약</text><rect x="70" y="90" rx="14" width="230" height="110" class="box a"/><text x="92" y="125" class="h">요약자</text><text x="92" y="154" class="s">제3자에게 이행하도록 약정</text><rect x="375" y="90" rx="14" width="230" height="110" class="box b"/><text x="397" y="125" class="h">낙약자(채무자)</text><text x="397" y="154" class="s">제3자에게 직접 이행</text><rect x="680" y="90" rx="14" width="230" height="110" class="box c"/><text x="702" y="125" class="h">수익자(제3자)</text><text x="702" y="154" class="s">수익의사표시 → 권리 발생</text><line x1="300" y1="145" x2="365" y2="145" class="line"/><line x1="605" y1="145" x2="670" y2="145" class="line"/><text x="70" y="245" class="s">민법 제539조: 제3자는 직접 이행청구 가능</text><text x="70" y="275" class="s">민법 제542조: 채무자는 계약에 기한 항변으로 제3자에게 대항 가능</text></svg>