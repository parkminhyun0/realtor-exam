<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460"><rect width="1120" height="460" rx="28" fill="#f8faf9"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#24483f">공유 · 합유 · 총유 비교</text><rect x="56" y="95" width="310" height="270" rx="20" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="84" y="137" font-family="sans-serif" font-size="22" font-weight="700" fill="#315f8f">공유</text><text x="84" y="176" font-family="sans-serif" font-size="17" fill="#495d72">지분에 의한 수인의 소유</text><text x="84" y="211" font-family="sans-serif" font-size="17" fill="#495d72">자기 지분 처분: 각자</text><text x="84" y="246" font-family="sans-serif" font-size="17" fill="#495d72">공유물 처분·변경: 전원</text><text x="84" y="281" font-family="sans-serif" font-size="17" fill="#495d72">관리: 지분 과반수</text><text x="84" y="316" font-family="sans-serif" font-size="17" fill="#495d72">보존: 각자</text><text x="84" y="350" font-family="sans-serif" font-size="17" font-weight="700" fill="#b42323">분할청구 원칙적 가능</text><rect x="405" y="95" width="310" height="270" rx="20" fill="#e9f5ef" stroke="#316d63" stroke-width="2"/><text x="433" y="137" font-family="sans-serif" font-size="22" font-weight="700" fill="#316d63">합유</text><text x="433" y="176" font-family="sans-serif" font-size="17" fill="#48635c">조합체로서 물건 소유</text><text x="433" y="211" font-family="sans-serif" font-size="17" fill="#48635c">지분 처분: 전원 동의</text><text x="433" y="246" font-family="sans-serif" font-size="17" fill="#48635c">합유물 처분·변경: 전원 동의</text><text x="433" y="281" font-family="sans-serif" font-size="17" fill="#48635c">보존: 각자</text><text x="433" y="316" font-family="sans-serif" font-size="17" fill="#48635c">존속 중 분할청구 불가</text><rect x="754" y="95" width="310" height="270" rx="20" fill="#fff7e9" stroke="#bf913d" stroke-width="2"/><text x="782" y="137" font-family="sans-serif" font-size="22" font-weight="700" fill="#806329">총유</text><text x="782" y="176" font-family="sans-serif" font-size="17