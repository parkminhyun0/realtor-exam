<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:19px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a2b3c4;stroke-width:2}.a{fill:#fff1ee}.b{fill:#eef6fb}.c{fill:#eef8f2}</style><text x="40" y="40" class="t">해제·해지 판단 구조</text><rect x="40" y="78" rx="14" width="280" height="190" class="box a"/><text x="62" y="115" class="h">해제</text><text x="62" y="148" class="s">법정사유: 이행지체·정기행위·불능</text><text x="62" y="176" class="s">효과: 원상회복 + 제3자 보호</text><text x="62" y="204" class="s">원상회복은 동시이행</text><text x="62" y="232" class="s">손해배상 병존 가능</text><rect x="350" y="78" rx="14" width="280" height="190" class="box b"/><text x="372" y="115" class="h">해지</text><text x="372" y="148" class="s">계속적 계약관계 종료</text><text x="372" y="176" class="s">효과: 장래에 대하여 효력 상실</text><text x="372" y="204" class="s">민법 제550조</text><rect x="660" y="78" rx="14" width="280" height="190" class="box c"/><text x="682" y="115" class="h">공통</text><text x="682" y="148" class="s">상대방에 대한 의사표시</text><text x="682" y="176" class="s">행사 후 철회 불가</text><text x="682" y="204" class="s">수인 당사자 = 불가분성 주의</text><text x="40" y="310" class="s">핵심: 해제 = 원상회복 / 해지 = 장래효</text></svg>