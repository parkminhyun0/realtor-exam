<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440"><rect width="1120" height="440" rx="28" fill="#fafbfc"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#2d4054">공동저당 · 민법 제368조</text><rect x="56" y="105" width="470" height="220" rx="20" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="86" y="147" font-family="sans-serif" font-size="22" font-weight="700" fill="#315f8f">동시배당</text><text x="86" y="188" font-family="sans-serif" font-size="17" fill="#4b5f73">여러 부동산의 경매대가를 동시에 배당</text><text x="86" y="226" font-family="sans-serif" font-size="18" font-weight="700" fill="#315f8f">각 부동산 경매대가에 비례하여</text><text x="86" y="260" font-family="sans-serif" font-size="18" font-weight="700" fill="#315f8f">선순위채권의 분담액 결정</text><text x="86" y="298" font-family="sans-serif" font-size="16" fill="#647487">→ 각 부동산 후순위권리자의 기대를 조정</text><rect x="594" y="105" width="470" height="220" rx="20" fill="#fff7e8" stroke="#c2953e" stroke-width="2"/><text x="624" y="147" font-family="sans-serif" font-size="22" font-weight="700" fill="#806327">이시배당</text><text x="624" y="188" font-family="sans-serif" font-size="17" fill="#685c42">일부 부동산의 경매대가를 먼저 배당</text><text x="624" y="226" font-family="sans-serif" font-size="18" font-weight="700" fill="#806327">선순위저당권자는 먼저 경매된 대가에서</text><text x="624" y="260" font-family="sans-serif" font-size="18" font-weight="700" fill="#806327">채권 전부를 변제받을 수 있음</text><text x="624" y="298" font-family="sans-serif" font-size="16" fill="#6d654f">→ 후순위저당권자의 선순위 대위 문제 발생</text><rect x="56" y="350" width="1008" height="50" rx="14" fill="#fff3f3"/><text x="84" y="383" font-family="sans-serif" font-size="17" font-weight="700" fill="#b42323">계산문제는 ‘각 부동산 경매대가 비율’과 ‘후순위자의 대위범위’를 분리해서 계산</text></svg>