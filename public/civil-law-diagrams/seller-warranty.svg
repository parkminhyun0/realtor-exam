<svg xmlns="http://www.w3.org/2000/svg" width="980" height="350" viewBox="0 0 980 350"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:13px;fill:#65778a}.box{fill:#fff;stroke:#a0b3c6;stroke-width:2}.a{fill:#eef5fb}.b{fill:#fff5e9}.c{fill:#eef8f2}.d{fill:#fff0ee}</style><text x="40" y="40" class="t">매도인의 담보책임 구별</text><rect x="40" y="78" rx="14" width="210" height="190" class="box a"/><text x="60" y="112" class="h">타인의 권리</text><text x="60" y="142" class="s">제569조·제570조</text><text x="60" y="170" class="s">권리 취득·이전 불능 시</text><text x="60" y="194" class="s">해제·손해배상 문제</text><rect x="275" y="78" rx="14" width="210" height="190" class="box b"/><text x="295" y="112" class="h">목적물 하자</text><text x="295" y="142" class="s">제580조</text><text x="295" y="170" class="s">매수인의 악의·과실 확인</text><text x="295" y="194" class="s">경매에는 적용 ×</text><rect x="510" y="78" rx="14" width="210" height="190" class="box c"/><text x="530" y="112" class="h">행사기간</text><text x="530" y="142" class="s">제582조</text><text x="530" y="170" class="s">제580·581 권리</text><text x="530" y="194" class="s">사실 안 날부터 6월</text><rect x="745" y="78" rx="14" width="195" height="190" class="box d"/><text x="765" y="112" class="h">면책특약 한계</text><text x="765" y="142" class="s">제584조</text><text x="765" y="170" class="s">알고도 고지하지 않은 사실</text><text x="765" y="194" class="s">제3자 권리설정·양도</text><text x="40" y="312" class="s">경매는 제578조의 특별구조를 먼저 적용하고, 제580조 하자담보는 적용하지 않습니다.</text></svg>