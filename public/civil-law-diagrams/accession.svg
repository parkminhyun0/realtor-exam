<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420"><rect width="1120" height="420" rx="28" fill="#fbfbf9"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#4c4938">첨부: 부합 · 혼화 · 가공</text><rect x="56" y="100" width="310" height="220" rx="20" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="84" y="142" font-family="sans-serif" font-size="22" font-weight="700" fill="#315f8f">부합</text><text x="84" y="181" font-family="sans-serif" font-size="17" fill="#4a5e72">제256조·제257조</text><text x="84" y="215" font-family="sans-serif" font-size="17" fill="#4a5e72">물건이 결합되어 분리 곤란</text><text x="84" y="249" font-family="sans-serif" font-size="17" fill="#4a5e72">부동산에 부합한 물건은</text><text x="84" y="281" font-family="sans-serif" font-size="17" font-weight="700" fill="#315f8f">원칙적으로 부동산 소유자에게</text><rect x="405" y="100" width="310" height="220" rx="20" fill="#eaf5ef" stroke="#316d63" stroke-width="2"/><text x="433" y="142" font-family="sans-serif" font-size="22" font-weight="700" fill="#316d63">혼화</text><text x="433" y="181" font-family="sans-serif" font-size="17" fill="#4b625c">제258조</text><text x="433" y="215" font-family="sans-serif" font-size="17" fill="#4b625c">서로 다른 물건이 섞여</text><text x="433" y="249" font-family="sans-serif" font-size="17" fill="#4b625c">식별하기 어려운 경우</text><text x="433" y="281" font-family="sans-serif" font-size="17" font-weight="700" fill="#316d63">동산부합 규정을 준용</text><rect x="754" y="100" width="310" height="220" rx="20" fill="#fff7e8" stroke="#c2953e" stroke-width="2"/><text x="782" y="142" font-family="sans-serif" font-size="22" font-weight="700" fill="#806327">가공</text><text x="782" y="181" font-family="sans-serif" font-size="17" fill="#685c42">제259조</text><text x="782" y="215" font-family="sans-serif" font-size="17" fill="#685c42">타인의 재료에 노력하여</text><text x="782" y="249" font-family="sans-serif" font-size="17" fill="#685c42">새 물건을 만든 경우</text><text x="782" y="281" font-family="sans-serif" font-size="17" font-weight="700" fill="#806327">재료가액 ↔ 가공증가액 비교</text><text x="56" y="370" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">시험 포인트: 누가 소유권을 취득하는지 + 기존 권리의 소멸·구상관계를 분리해서 판단</text></svg>