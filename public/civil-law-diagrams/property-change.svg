<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470"><rect width="1120" height="470" rx="28" fill="#f8fafc"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#233b55">부동산 물권변동 판단순서</text><rect x="56" y="100" width="250" height="120" rx="18" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="84" y="145" font-family="sans-serif" font-size="21" font-weight="700" fill="#315f8f">원인 확인</text><text x="84" y="182" font-family="sans-serif" font-size="17" fill="#41566d">법률행위인가?</text><path d="M306 160 H382" stroke="#6a7c8e" stroke-width="4"/><polygon points="382,160 366,151 366,169" fill="#6a7c8e"/><rect x="382" y="80" width="300" height="140" rx="18" fill="#e9f5ef" stroke="#2f725e" stroke-width="2"/><text x="410" y="122" font-family="sans-serif" font-size="21" font-weight="700" fill="#2f725e">YES · 민법 제186조</text><text x="410" y="160" font-family="sans-serif" font-size="17" fill="#405f56">매매·증여 등 법률행위</text><text x="410" y="194" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">등기해야 물권변동 효력</text><rect x="382" y="260" width="300" height="140" rx="18" fill="#fff7e8" stroke="#bd8b2d" stroke-width="2"/><text x="410" y="302" font-family="sans-serif" font-size="21" font-weight="700" fill="#84621f">NO · 민법 제187조</text><text x="410" y="340" font-family="sans-serif" font-size="17" fill="#675a3e">상속·공용징수·판결·경매 등</text><text x="410" y="374" font-family="sans-serif" font-size="17" font-weight="700" fill="#7b5620">등기 없이 취득 · 처분 전 등기 필요</text><path d="M682 150 H758" stroke="#6a7c8e" stroke-width="4"/><polygon points="758,150 742,141 742,159" fill="#6a7c8e"/><path d="M682 330 H758" stroke="#6a7c8e" stroke-width="4"/><polygon points="758,330 742,321 742,339" fill="#6a7c8e"/><rect x="758" y="150" width="306" height="180" rx="18" fill="#fff" stroke="#9eabb8" stroke-width="2"/><text x="786" y="193" font-family="sans-serif" font-size="21" font-weight="700" fill="#3c4d5d">시험 함정</text><text x="786" y="231" font-family="sans-serif" font-size="17" fill="#4f5f6e">• 계약 성립 ≠ 소유권이전 완성</text><text x="786" y="266" font-family="sans-serif" font-size="17" fill="#4f5f6e">• 제187조 취득 ≠ 처분 자유</text><text x="786" y="301" font-family="sans-serif" font-size="17" fill="#4f5f6e">• 등기의 공신력은 일반적으로 인정되지 않음</text><text x="56" y="440" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">핵심 암기: 186 = 법률행위·등기 / 187 = 법률규정·취득은 등기 불요, 처분에는 등기</text></svg>