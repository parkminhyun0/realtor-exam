<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;fill:#24384f}.t{font-size:30px;font-weight:800}.h{font-size:22px;font-weight:800}.b{font-size:17px}.s{font-size:15px;fill:#66788a}.box{fill:#fff;stroke:#d3dde7;stroke-width:2}.blue{fill:#eef5fb;stroke:#6e8faf}.green{fill:#eff8f2;stroke:#72a084}.gold{fill:#fff8e8;stroke:#caa65a}.line{stroke:#7f95a9;stroke-width:3;fill:none}.arrow{marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7f95a9"/></marker></defs><text x="60" y="55" class="t">대리의 3면관계 · 민법 제114조 이하</text><rect x="70" y="130" width="250" height="120" rx="20" class="blue"/><text x="195" y="175" text-anchor="middle" class="h">본인</text><text x="195" y="208" text-anchor="middle" class="s">대리효과의 귀속주체</text><rect x="475" y="130" width="250" height="120" rx="20" class="green"/><text x="600" y="175" text-anchor="middle" class="h">대리인</text><text x="600" y="208" text-anchor="middle" class="s">의사표시를 직접 하는 자</text><rect x="880" y="130" width="250" height="120" rx="20" class="gold"/><text x="1005" y="175" text-anchor="middle" class="h">상대방</text><text x="1005" y="208" text-anchor="middle" class="s">대리행위의 거래상대방</text><path d="M320 165 H475" class="line arrow"/><text x="397" y="145" text-anchor="middle" class="b">수권행위·대리권</text><path d="M725 165 H880" class="line arrow"/><text x="802" y="145" text-anchor="middle" class="b">대리행위·현명</text><path d="M880 230 C760 335 440 335 320 230" class="line arrow"/><text x="600" y="350" text-anchor="middle" class="h">법률효과는 직접 본인 ↔ 상대방 사이에 발생</text><rect x="70" y="405" width="250" height="120" rx="16" class="box"/><text x="195" y="442" text-anchor="middle" class="h">대리권 범위</text><text x="195" y="474" text-anchor="middle" class="s">제118조 보존·이용·개량</text><text x="195" y="499" text-anchor="middle" class="s">범위 초과 → 무권대리 검토</text><rect x="350" y="405" width="250" height="120" rx="16" class="box"/><text x="475" y="442" text-anchor="middle" class="h">대리권 제한</text><text x="475" y="474" text-anchor="middle" class="s">제119조 각자대리</text><text x="475" y="499" text-anchor="middle" class="s">제124조 자기계약·쌍방대리</text><rect x="630" y="405" width="250" height="120" rx="16" class="box"/><text x="755" y="442" text-anchor="middle" class="h">대리행위 하자</text><text x="755" y="474" text-anchor="middle" class="s">제116조 원칙: 대리인 기준</text><text x="755" y="499" text-anchor="middle" class="s">본인의 지시 예외 확인</text><rect x="910" y="405" width="220" height="120" rx="16" class="box"/><text x="1020" y="442" text-anchor="middle" class="h">행위능력</text><text x="1020" y="474" text-anchor="middle" class="s">제117조</text><text x="1020" y="499" text-anchor="middle" class="s">대리인은 능력자일 필요 없음</text></svg>