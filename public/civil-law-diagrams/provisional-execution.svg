<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:16px;font-weight:700}.s{font-size:13px;fill:#60758a}.n{font-size:22px;font-weight:800;fill:#b42323}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}.y{fill:#fff7df}</style><text x="40" y="42" class="t">가등기담보권 실행: 귀속청산 vs 경매</text><rect x="35" y="82" width="150" height="120" rx="13" class="b a"/><text x="55" y="116" class="h">변제기 도래</text><text x="210" y="150" class="h">→</text><rect x="250" y="82" width="160" height="120" rx="13" class="b"/><text x="270" y="116" class="h">실행통지</text><text x="270" y="148" class="s">청산금 평가액 등</text><text x="435" y="150" class="h">→</text><rect x="475" y="82" width="160" height="120" rx="13" class="b g"/><text x="495" y="116" class="h">도달 후</text><text x="495" y="157" class="n">2개월</text><text x="495" y="184" class="s">청산기간</text><text x="660" y="150" class="h">→</text><rect x="700" y="82" width="240" height="120" rx="13" class="b y"/><text x="720" y="116" class="h">청산금 지급</text><text x="720" y="148" class="s">→ 소유권 취득·본등기</text><text x="40" y="245" class="h">선택 가능한 다른 길</text><text x="245" y="245" class="h">→</text><rect x="300" y="220" width="350" height="65" rx="12" class="b a"/><text x="325" y="250" class="h">경매청구 → 저당권으로 보아 우선변제</text><text x="40" y="312" class="s">시험 핵심: 청산기간은 통지 ‘발송일’이 아니라 통지가 채무자등에게 ‘도달한 날’부터 2개월입니다.</text></svg>