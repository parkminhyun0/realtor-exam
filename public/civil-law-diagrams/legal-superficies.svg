<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430"><rect width="1120" height="430" rx="28" fill="#fbfaf8"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#4b4033">법정지상권 비교</text><rect x="56" y="100" width="470" height="230" rx="20" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="86" y="143" font-family="sans-serif" font-size="22" font-weight="700" fill="#315f8f">민법 제366조 법정지상권</text><text x="86" y="183" font-family="sans-serif" font-size="17" fill="#4c6074">저당권 설정 당시 토지·건물 관계 확인</text><text x="86" y="218" font-family="sans-serif" font-size="17" fill="#4c6074">→ 저당물의 경매</text><text x="86" y="253" font-family="sans-serif" font-size="17" fill="#4c6074">→ 토지와 건물 소유자 분리</text><text x="86" y="291" font-family="sans-serif" font-size="18" font-weight="700" fill="#b42323">법률의 명문에 의해 지상권 성립</text><rect x="594" y="100" width="470" height="230" rx="20" fill="#fff7e8" stroke="#c2953e" stroke-width="2"/><text x="624" y="143" font-family="sans-serif" font-size="22" font-weight="700" fill="#806327">관습법상 법정지상권</text><text x="624" y="183" font-family="sans-serif" font-size="17" fill="#685c42">동일인 소유 토지·건물이</text><text x="624" y="218" font-family="sans-serif" font-size="17" fill="#685c42">매매·증여 등으로 소유자를 달리함</text><text x="624" y="253" font-family="sans-serif" font-size="17" fill="#685c42">건물철거 약정 등 판례요건 확인</text><text x="624" y="291" font-family="sans-serif" font-size="18" font-weight="700" fill="#806327">민법 명문이 아닌 관습법·판례 영역</text><rect x="56" y="350" width="1008" height="48" rx="14" fill="#fff3f3"/><text x="84" y="382" font-family="sans-serif" font-size="17" font-weight="700" fill="#b42323">시험순서: 분리 원인이 경매인가? → 저당권 설정 당시 건물 존재·동일소유? → 아니면 관습법상 요건 검토</text></svg>