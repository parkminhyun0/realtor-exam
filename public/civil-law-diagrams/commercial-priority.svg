<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:17px;font-weight:700}.s{font-size:14px;fill:#60758a}.b{fill:#fff;stroke:#9db1c4;stroke-width:2}.a{fill:#edf5fb}.g{fill:#eef8f2}.y{fill:#fff7df}</style><text x="40" y="42" class="t">상가임대차: 대항력 · 우선변제 · 최우선변제</text><rect x="40" y="82" width="280" height="150" rx="14" class="b a"/><text x="65" y="118" class="h">대항력</text><text x="65" y="149" class="s">건물 인도 + 사업자등록 신청</text><text x="65" y="177" class="s">→ 다음 날 제3자 대항</text><rect x="350" y="82" width="280" height="150" rx="14" class="b g"/><text x="375" y="118" class="h">우선변제권</text><text x="375" y="149" class="s">대항요건 + 확정일자</text><text x="375" y="177" class="s">→ 경매·공매 우선배당</text><rect x="660" y="82" width="280" height="150" rx="14" class="b y"/><text x="685" y="118" class="h">최우선변제권</text><text x="685" y="149" class="s">소액임차인 + 시행령 기준</text><text x="685" y="177" class="s">→ 보증금 중 일정액 우선</text><text x="40" y="276" class="s">주택과 비교: 주민등록이 아니라 사업자등록 신청이 대항요건이며, 확정일자는 관할 세무서에서 받습니다.</text></svg>