<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#24384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#a0b3c5;stroke-width:2}.a{fill:#eef5fb}.b{fill:#fff5e9}.c{fill:#eef8f2}.line{stroke:#71869a;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#71869a"/></marker></defs><text x="40" y="40" class="t">매매의 기본 구조</text><rect x="60" y="88" rx="14" width="270" height="160" class="box a"/><text x="82" y="125" class="h">매도인</text><text x="82" y="158" class="s">재산권 이전의무</text><text x="82" y="186" class="s">담보책임 문제</text><rect x="650" y="88" rx="14" width="270" height="160" class="box b"/><text x="672" y="125" class="h">매수인</text><text x="672" y="158" class="s">대금 지급의무</text><text x="672" y="186" class="s">권리이전·인도 청구</text><rect x="375" y="110" rx="14" width="230" height="120" class="box c"/><text x="397" y="148" class="h">매매계약</text><text x="397" y="180" class="s">낙성 · 유상 · 쌍무</text><line x1="330" y1="168" x2="365" y2="168" class="line"/><line x1="605" y1="168" x2="640" y2="168" class="line"/><text x="60" y="292" class="s">특약·관습 없으면 권리이전과 대금지급은 동시이행(민법 제568조)</text></svg>