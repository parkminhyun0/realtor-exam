<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330"><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#25384e}.t{font-size:23px;font-weight:700}.h{font-size:18px;font-weight:700}.s{font-size:14px;fill:#65778a}.box{fill:#fff;stroke:#9db2c6;stroke-width:2}.a{fill:#edf5fb}.b{fill:#fff5e9}.c{fill:#eef8f2}</style><text x="40" y="40" class="t">쌍무계약의 효력 구조</text><rect x="40" y="78" rx="14" width="270" height="175" class="box a"/><text x="62" y="115" class="h">동시이행</text><text x="62" y="146" class="s">상대방 이행제공 전까지</text><text x="62" y="171" class="s">자기 이행 거절 가능</text><text x="62" y="205" class="s">민법 제536조</text><rect x="355" y="78" rx="14" width="270" height="175" class="box b"/><text x="377" y="115" class="h">위험부담</text><text x="377" y="146" class="s">쌍방 무책임 불능 → 반대급부 ×</text><text x="377" y="171" class="s">채권자 귀책 → 반대급부 가능</text><text x="377" y="205" class="s">민법 제537조·제538조</text><rect x="670" y="78" rx="14" width="270" height="175" class="box c"/><text x="692" y="115" class="h">제3자를 위한 계약</text><text x="692" y="146" class="s">수익의사표시 → 직접청구권 발생</text><text x="692" y="171" class="s">채무자는 계약상 항변 가능</text><text x="692" y="205" class="s">민법 제539조·제541조·제542조</text><text x="40" y="292" class="s">시험순서: 대가관계인지 → 이행거절 문제인지 → 불능·귀책 문제인지 → 제3자 권리 문제인지 구별</text></svg>