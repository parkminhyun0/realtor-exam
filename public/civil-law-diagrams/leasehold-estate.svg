<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410"><rect width="1120" height="410" rx="28" fill="#fbfaf8"/><text x="56" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#493f32">전세권 핵심 흐름</text><rect x="56" y="108" width="220" height="110" rx="16" fill="#fff7e8" stroke="#c2953e" stroke-width="2"/><text x="82" y="148" font-family="sans-serif" font-size="18" font-weight="700" fill="#806327">전세금 지급</text><text x="82" y="181" font-family="sans-serif" font-size="14" fill="#685c42">+ 설정계약·등기</text><path d="M276 163 H330" stroke="#7c776c" stroke-width="4"/><polygon points="330,163 316,155 316,171" fill="#7c776c"/><rect x="330" y="108" width="220" height="110" rx="16" fill="#eaf5ef" stroke="#316d63" stroke-width="2"/><text x="356" y="148" font-family="sans-serif" font-size="18" font-weight="700" fill="#316d63">점유·사용·수익</text><text x="356" y="181" font-family="sans-serif" font-size="14" fill="#4b625c">제303조</text><path d="M550 163 H604" stroke="#7c776c" stroke-width="4"/><polygon points="604,163 590,155 590,171" fill="#7c776c"/><rect x="604" y="108" width="220" height="110" rx="16" fill="#eef4fb" stroke="#315f8f" stroke-width="2"/><text x="630" y="148" font-family="sans-serif" font-size="18" font-weight="700" fill="#315f8f">양도·전전세</text><text x="630" y="181" font-family="sans-serif" font-size="14" fill="#4b5f73">제306조·제308조</text><path d="M824 163 H878" stroke="#7c776c" stroke-width="4"/><polygon points="878,163 864,155 864,171" fill="#7c776c"/><rect x="878" y="90" width="186" height="146" rx="16" fill="#fff1f1" stroke="#b7584f" stroke-width="2"/><text x="904" y="132" font-family="sans-serif" font-size="18" font-weight="700" fill="#9e3e36">소멸</text><text x="904" y="165" font-family="sans-serif" font-size="14" fill="#684f4d">인도·말소 ↔ 전세금반환</text><text x="904" y="197" font-family="sans-serif" font-size="14" fill="#684f4d">반환지체 → 경매청구</text><rect x="56" y="265" width="1008" height="78" rx="16" fill="#fff" stroke="#ddd7ce"/><text x="84" y="299" font-family="sans-serif" font-size="17" font-weight="700" fill="#b42323">숫자: 존속기간 최대 10년 · 건물전세권을 1년 미만으로 정하면 1년</text><text x="84" y="327" font-family="sans-serif" font-size="16" fill="#5f5a52">전세권은 물권 + 사용수익권 + 우선변제권이라는 복합구조</text></svg>