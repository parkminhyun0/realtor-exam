<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">수요의 가격탄력성</title><desc id="d">탄력적, 단위탄력적, 비탄력적, 완전탄력적, 완전비탄력적 수요와 총수입 관계</desc><rect width="1200" height="720" rx="28" fill="#f7f9fc"/><text x="600" y="68" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="800" fill="#0b2b58">수요의 가격탄력성</text><text x="600" y="104" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#52657b">가격 변화에 대한 수요량 반응 · 그래프와 총수입 관계</text><g font-family="sans-serif" font-size="18" fill="#142c47"><g transform="translate(40 150)"><rect width="210" height="350" rx="18" fill="#fff" stroke="#bdd0e7"/><text x="105" y="34" text-anchor="middle" font-weight="800" fill="#1d5fbf">탄력적 |ε|&gt;1</text><path d="M38 292V76M38 292H182" stroke="#26374a" stroke-width="3"/><path d="M55 105L172 260" stroke="#1d5fbf" stroke-width="5"/><text x="178" y="276">Q</text><text x="20" y="70">P</text><text x="105" y="326" text-anchor="middle" fill="#be2c2c">P↑ → TR↓</text></g><g transform="translate(270 150)"><rect width="210" height="350" rx="18" fill="#fff" stroke="#bdd0e7"/><text x="105" y="34" text-anchor="middle" font-weight="800" fill="#138b8b">단위탄력 |ε|=1</text><path d="M38 292V76M38 292H182" stroke="#26374a" stroke-width="3"/><path d="M55 100L170 270" stroke="#138b8b" stroke-width="5"/><text x="178" y="276">Q</text><text x="20" y="70">P</text><text x="105" y="326" text-anchor="middle" fill="#138b8b">TR 최대·불변 경계</text></g><g transform="translate(500 150)"><rect width="210" height="350" rx="18" fill="#fff" stroke="#bdd0e7"/><text x="105" y="34" text-anchor="middle" font-weight="800" fill="#2f8b4b">비탄력적 |ε|&lt;1</text><path d="M38 292V76M38 292H182" stroke="#26374a" stroke-width="3"/><path d="M90 95L130 270" stroke="#2f8b4b" stroke-width="5"/><text x="178" y="276">Q</text><text x="20" y="70">P</text><text x="105" y="326" text-anchor="middle" fill="#be2c2c">P↑ → TR↑</text></g><g transform="translate(730 150)"><rect width="210" height="350" rx="18" fill="#fff" stroke="#bdd0e7"/><text x="105" y="34" text-anchor="middle" font-weight="800" fill="#d78700">완전탄력 |ε|=∞</text><path d="M38 292V76M38 292H182" stroke="#26374a" stroke-width="3"/><path d="M48 180H174" stroke="#d78700" stroke-width="5"/><text x="178" y="276">Q</text><text x="20" y="70">P</text><text x="105" y="326" text-anchor="middle" fill="#704c00">수평 수요곡선</text></g><g transform="translate(960 150)"><rect width="200" height="350" rx="18" fill="#fff" stroke="#bdd0e7"/><text x="100" y="34" text-anchor="middle" font-weight="800" fill="#6e55aa">완전비탄력 |ε|=0</text><path d="M38 292V76M38 292H172" stroke="#26374a" stroke-width="3"/><path d="M108 90V275" stroke="#6e55aa" stroke-width="5"/><text x="168" y="276">Q</text><text x="20" y="70">P</text><text x="100" y="326" text-anchor="middle" fill="#5d4b8a">수직 수요곡선</text></g></g><g transform="translate(54 535)" font-family="sans-serif"><rect width="1092" height="135" rx="18" fill="#eef5ff" stroke="#adc8ed"/><text x="28" y="38" font-size="24" font-weight="800" fill="#0b4d9a">시험 포인트</text><text x="28" y="74" font-size="19" fill="#243d59">• 탄력성은 곡선의 기울기와 같은 개념이 아니다. 같은 직선 수요곡선에서도 점마다 탄력성이 달라진다.</text><text x="28" y="106" font-size="19" fill="#243d59">• 기준점 방식과 중간점 방식을 구분하고, 변화율의 분모가 무엇인지 먼저 확인한다.</text></g></svg>