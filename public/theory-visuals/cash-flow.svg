<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">부동산 투자 현금흐름</title><desc id="d">가능총소득에서 유효총소득, 순영업소득, 세전현금수지까지와 매각흐름</desc><rect width="1200" height="720" rx="28" fill="#f8fafc"/><text x="600" y="64" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="800" fill="#0b2b58">부동산 투자 현금흐름</text><text x="600" y="101" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#596d83">PGI → EGI → NOI → BTCF · 매각 시 지분복귀액</text><g font-family="sans-serif"><g transform="translate(70 145)"><rect width="500" height="460" rx="20" fill="#fff" stroke="#b8cbe4"/><text x="250" y="40" text-anchor="middle" font-size="25" font-weight="800" fill="#1b5fb8">영업흐름</text><g font-size="19"><rect x="85" y="70" width="330" height="58" rx="13" fill="#eef5ff" stroke="#b9cee9"/><text x="250" y="106" text-anchor="middle" font-weight="800" fill="#174d8e">잠재총소득 PGI</text><path d="M250 128V158" stroke="#66788b" stroke-width="4"/><rect x="60" y="158" width="180" height="54" rx="12" fill="#fff1f0" stroke="#e4aaa5"/><text x="150" y="191" text-anchor="middle" fill="#a43c35">− 공실·불량부채</text><rect x="260" y="158" width="180" height="54" rx="12" fill="#eff9ec" stroke="#b6d9ad"/><text x="350" y="191" text-anchor="middle" fill="#3f7935">+ 기타소득</text><path d="M250 212V240" stroke="#66788b" stroke-width="4"/><rect x="85" y="240" width="330" height="58" rx="13" fill="#ecfbfa" stroke="#b5d8d6"/><text x="250" y="276" text-anchor="middle" font-weight="800" fill="#116f70">유효총소득 EGI</text><path d="M250 298V326" stroke="#66788b" stroke-width="4"/><rect x="85" y="326" width="330" height="54" rx="12" fill="#fff1f0" stroke="#e4aaa5"/><text x="250" y="359" text-anchor="middle" fill="#a43c35">− 영업경비 OE</text><path d="M250 380V407" stroke="#66788b" stroke-width="4"/><rect x="85" y="407" width="330" height="58" rx="13" fill="#eff9ec" stroke="#b6d9ad"/><text x="250" y="443" text-anchor="middle" font-weight="800" fill="#367536">순영업소득 NOI</text></g></g><g transform="translate(630 145)"><rect width="500" height="460" rx="20" fill="#fff" stroke="#c9b9e2"/><text x="250" y="40" text-anchor="middle" font-size="25" font-weight="800" fill="#6d54a8">지분현금흐름·매각흐름</text><g font-size="19"><rect x="85" y="74" width="330" height="58" rx="13" fill="#eff9ec" stroke="#b6d9ad"/><text x="250" y="110" text-anchor="middle" font-weight="800" fill="#367536">NOI</text><path d="M250 132V160" stroke="#66788b" stroke-width="4"/><rect x="85" y="160" width="330" height="54" rx="12" fill="#fff1f0" stroke="#e4aaa5"/><text x="250" y="193" text-anchor="middle" fill="#a43c35">− 부채서비스액 DS</text><path d="M250 214V242" stroke="#66788b" stroke-width="4"/><rect x="85" y="242" width="330" height="58" rx="13" fill="#fff8e9" stroke="#e6c27e"/><text x="250" y="278" text-anchor="middle" font-weight="800" fill="#a76500">세전현금수지 BTCF</text><text x="250" y="333" text-anchor="middle" font-size="18" font-weight="800" fill="#5d4a82">매각 시</text><rect x="45" y="350" width="410" height="96" rx="14" fill="#f4f0fb" stroke="#c8b8e1"/><text x="250" y="383" text-anchor="middle" fill="#5a4689">매도가격 − 매도경비 = 순매도액</text><text x="250" y="417" text-anchor="middle" fill="#5a4689">순매도액 − 미상환저당잔금 = 세전지분복귀액</text></g></g></g><g transform="translate(55 635)" font-family="sans-serif"><rect width="1090" height="55" rx="14" fill="#eef5ff" stroke="#b5cce8"/><text x="28" y="35" font-size="18" fill="#27445f">주의: 부채서비스액은 NOI 산출 전에 빼지 않는다. NOI 이후 지분현금흐름에서 차감한다.</text></g></svg>