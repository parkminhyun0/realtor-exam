<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">상권분석 핵심 모형</title><desc id="d">레일리 소매인력 법칙, 컨버스 분기점, 허프 확률모형 비교</desc><rect width="1200" height="720" rx="28" fill="#f8fafc"/><text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="800" fill="#0b2b58">상권분석 핵심 모형</text><text x="600" y="102" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#5a6b80">레일리 · 컨버스 · 허프를 한눈에 구분</text><g font-family="sans-serif"><g transform="translate(45 150)"><rect width="350" height="430" rx="20" fill="#fff" stroke="#b8cce6"/><text x="175" y="42" text-anchor="middle" font-size="25" font-weight="800" fill="#1b5fb8">① 레일리 소매인력</text><circle cx="72" cy="145" r="32" fill="#dfeeff" stroke="#1b5fb8"/><circle cx="276" cy="145" r="32" fill="#dff7f4" stroke="#178e88"/><text x="72" y="151" text-anchor="middle" font-size="22" font-weight="800">A</text><text x="276" y="151" text-anchor="middle" font-size="22" font-weight="800">B</text><path d="M105 145H243" stroke="#6d7b88" stroke-width="8"/><text x="174" y="127" text-anchor="middle" font-size="16" fill="#55677b">거리 D</text><rect x="42" y="215" width="266" height="88" rx="14" fill="#eef5ff"/><text x="175" y="247" text-anchor="middle" font-size="18" fill="#0b4e9b">흡인력 ∝ 도시규모 ÷ 거리²</text><text x="175" y="278" text-anchor="middle" font-size="18" font-weight="800" fill="#1e3c5d">큰 도시·가까운 도시가 유리</text><text x="35" y="354" font-size="17" fill="#40556d">• 두 도시 간 소비액 배분</text><text x="35" y="386" font-size="17" fill="#40556d">• 거리비는 반드시 제곱</text></g><g transform="translate(425 150)"><rect width="350" height="430" rx="20" fill="#fff" stroke="#b8cce6"/><text x="175" y="42" text-anchor="middle" font-size="25" font-weight="800" fill="#168b8b">② 컨버스 분기점</text><circle cx="60" cy="145" r="28" fill="#dfeeff" stroke="#1b5fb8"/><circle cx="292" cy="145" r="28" fill="#dff7f4" stroke="#168b8b"/><path d="M88 145H264" stroke="#6d7b88" stroke-width="7"/><circle cx="205" cy="145" r="10" fill="#e18a00"/><text x="205" y="119" text-anchor="middle" font-size="17" fill="#c06f00">분기점 X</text><text x="60" y="151" text-anchor="middle" font-size="20" font-weight="800">A</text><text x="292" y="151" text-anchor="middle" font-size="20" font-weight="800">B</text><rect x="38" y="215" width="274" height="96" rx="14" fill="#ecfbfa"/><text x="175" y="246" text-anchor="middle" font-size="17" fill="#116f70">dA = D ÷ (1 + √(PB÷PA))</text><text x="175" y="278" text-anchor="middle" font-size="17" font-weight="800" fill="#244b5a">큰 도시 쪽으로 경계가 가까워짐</text><text x="35" y="354" font-size="17" fill="#40556d">• 상권 경계거리 계산</text><text x="35" y="386" font-size="17" fill="#40556d">• 어느 도시에서 재는지 확인</text></g><g transform="translate(805 150)"><rect width="350" height="430" rx="20" fill="#fff" stroke="#b8cce6"/><text x="175" y="42" text-anchor="middle" font-size="25" font-weight="800" fill="#6b54a8">③ 허프 확률모형</text><circle cx="175" cy="175" r="34" fill="#edf0f4"/><text x="175" y="182" text-anchor="middle" font-size="16" font-weight="800">소비자</text><g fill="#fff" stroke-width="3"><rect x="52" y="90" width="78" height="52" rx="10" stroke="#1b5fb8"/><rect x="222" y="90" width="78" height="52" rx="10" stroke="#168b8b"/><rect x="52" y="244" width="78" height="52" rx="10" stroke="#4c8b3c"/><rect x="222" y="244" width="78" height="52" rx="10" stroke="#e08016"/></g><path d="M137 156L106 132M213 156L248 132M139 196L108 245M210 196L247 245" stroke="#8a98a7" stroke-width="3" stroke-dasharray="7 7"/><rect x="35" y="326" width="280" height="74" rx="14" fill="#f2effb"/><text x="175" y="354" text-anchor="middle" font-size="17" fill="#5a428e">Pi = (Si / Diᵇ) ÷ Σ(Sj / Djᵇ)</text><text x="175" y="382" text-anchor="middle" font-size="16" font-weight="800" fill="#4a3a78">규모↑ 유리 · 거리↑ 불리</text></g></g><g transform="translate(55 610)" font-family="sans-serif"><rect width="1090" height="70" rx="16" fill="#eef5ff" stroke="#b5cce9"/><text x="28" y="43" font-size="19" fill="#25445f">시험 키워드: 소비액 배분=레일리 · 경계지점=컨버스 · 선택확률/점유율=허프</text></g></svg>