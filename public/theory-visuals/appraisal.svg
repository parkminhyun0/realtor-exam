<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">감정평가 핵심 방식 비교</title><desc id="d">원가법, 거래사례비교법, 수익환원법, 적산법의 출발자료와 산식 비교</desc><rect width="1200" height="720" rx="28" fill="#f8fafc"/><text x="600" y="64" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="800" fill="#0b2b58">감정평가 핵심 방식 비교</text><text x="600" y="101" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#5c6f84">원가법 · 거래사례비교법 · 수익환원법 · 적산법</text><g transform="translate(40 150)" font-family="sans-serif"><g><rect width="260" height="430" rx="20" fill="#fff" stroke="#b9cce6"/><text x="130" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#1b5fb8">① 원가법</text><text x="130" y="88" text-anchor="middle" font-size="18" fill="#52657b">비용성</text><rect x="30" y="122" width="200" height="90" rx="14" fill="#eef5ff"/><text x="130" y="158" text-anchor="middle" font-size="19" font-weight="800" fill="#174e90">재조달원가</text><text x="130" y="187" text-anchor="middle" font-size="19" fill="#174e90">− 감가누계액</text><text x="130" y="250" text-anchor="middle" font-size="23" font-weight="800" fill="#1b5fb8">= 적산가액</text><text x="26" y="316" font-size="17" fill="#40566f">• 건물·원가 파악 용이</text><text x="26" y="350" font-size="17" fill="#40566f">• 건축비지수·감가</text></g><g transform="translate(285)"><rect width="260" height="430" rx="20" fill="#fff" stroke="#b9d6d5"/><text x="130" y="44" text-anchor="middle" font-size="25" font-weight="800" fill="#168b8b">② 거래사례비교법</text><text x="130" y="88" text-anchor="middle" font-size="18" fill="#52657b">시장성</text><rect x="24" y="122" width="212" height="112" rx="14" fill="#ecfbfa"/><text x="130" y="154" text-anchor="middle" font-size="17" font-weight="800" fill="#116d6d">사례단가 × 사정보정</text><text x="130" y="183" text-anchor="middle" font-size="17" fill="#116d6d">× 시점수정 × 지역·개별요인</text><text x="130" y="212" text-anchor="middle" font-size="17" fill="#116d6d">× 대상면적</text><text x="130" y="270" text-anchor="middle" font-size="23" font-weight="800" fill="#168b8b">= 비준가액</text><text x="24" y="324" font-size="17" fill="#40566f">• 대상/사례 방향 확인</text><text x="24" y="358" font-size="17" fill="#40566f">• 상승식 보정</text></g><g transform="translate(570)"><rect width="260" height="430" rx="20" fill="#fff" stroke="#bdd8bd"/><text x="130" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#39813d">③ 수익환원법</text><text x="130" y="88" text-anchor="middle" font-size="18" fill="#52657b">수익성</text><rect x="30" y="122" width="200" height="90" rx="14" fill="#eff9ec"/><text x="130" y="158" text-anchor="middle" font-size="20" font-weight="800" fill="#316f34">NOI</text><text x="130" y="190" text-anchor="middle" font-size="20" fill="#316f34">÷ 환원이율</text><text x="130" y="250" text-anchor="middle" font-size="23" font-weight="800" fill="#39813d">= 수익가액</text><text x="28" y="316" font-size="17" fill="#40566f">• 안정적 단일기간 수익</text><text x="28" y="350" font-size="17" fill="#40566f">• 5% → 0.05 입력</text></g><g transform="translate(855)"><rect width="260" height="430" rx="20" fill="#fff" stroke="#e4c997"/><text x="130" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#d47b00">④ 적산법</text><text x="130" y="88" text-anchor="middle" font-size="18" fill="#52657b">임료·비용성</text><rect x="24" y="122" width="212" height="112" rx="14" fill="#fff8e9"/><text x="130" y="154" text-anchor="middle" font-size="18" font-weight="800" fill="#9d6008">기초가액 × 기대이율</text><text x="130" y="186" text-anchor="middle" font-size="18" fill="#9d6008">+ 필요제경비</text><text x="130" y="250" text-anchor="middle" font-size="23" font-weight="800" fill="#d47b00">= 적산임료</text><text x="27" y="316" font-size="17" fill="#40566f">• 가액 아닌 임료 산정</text><text x="27" y="350" font-size="17" fill="#40566f">• 기대이율 사용</text></g></g><g transform="translate(55 625)" font-family="sans-serif"><rect width="1090" height="58" rx="14" fill="#eef5ff" stroke="#b5cce8"/><text x="28" y="36" font-size="18" fill="#27445f">문제 첫 줄에서 재조달원가·사례가격·NOI·임료 중 무엇이 주어졌는지 먼저 확인하면 공식 선택이 빨라진다.</text></g></svg>