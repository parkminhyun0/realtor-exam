<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">화폐의 시간가치</title><desc id="d">현재가치, 미래가치, 연금계수, 감채기금계수, 저당상수, 잔금비율 핵심 구조</desc><rect width="1200" height="720" rx="28" fill="#f8fafc"/><text x="600" y="64" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="800" fill="#0b2b58">화폐의 시간가치</text><text x="600" y="101" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#5b6e84">PV · FV · 연금계수 · 감채기금계수 · 저당상수</text><g font-family="sans-serif"><rect x="55" y="145" width="250" height="170" rx="18" fill="#fff" stroke="#b9cce5"/><text x="180" y="183" text-anchor="middle" font-size="24" font-weight="800" fill="#1b5fb8">일시불 미래가치</text><text x="180" y="232" text-anchor="middle" font-size="26" font-weight="800" fill="#163f76">FV = PV(1+r)ⁿ</text><text x="180" y="274" text-anchor="middle" font-size="17" fill="#4f6278">현재금액을 미래로 이동</text><rect x="335" y="145" width="250" height="170" rx="18" fill="#fff" stroke="#bad7bf"/><text x="460" y="183" text-anchor="middle" font-size="24" font-weight="800" fill="#2e8846">일시불 현재가치</text><text x="460" y="232" text-anchor="middle" font-size="26" font-weight="800" fill="#216a37">PV = FV/(1+r)ⁿ</text><text x="460" y="274" text-anchor="middle" font-size="17" fill="#4f6278">미래금액을 현재로 할인</text><path d="M305 230H335" stroke="#66788b" stroke-width="4"/><path d="M315 220L333 230L315 240" fill="none" stroke="#66788b" stroke-width="4"/><rect x="615" y="145" width="250" height="170" rx="18" fill="#fff" stroke="#b9d3d7"/><text x="740" y="183" text-anchor="middle" font-size="23" font-weight="800" fill="#168b8b">연금 현재가치</text><text x="740" y="226" text-anchor="middle" font-size="19" font-weight="800" fill="#116b6b">PVAF = [1-(1+r)⁻ⁿ]/r</text><text x="740" y="274" text-anchor="middle" font-size="17" fill="#4f6278">정기지급액을 현재 일시금으로</text><rect x="895" y="145" width="250" height="170" rx="18" fill="#fff" stroke="#d4c8ea"/><text x="1020" y="183" text-anchor="middle" font-size="23" font-weight="800" fill="#6e55aa">연금 미래가치</text><text x="1020" y="226" text-anchor="middle" font-size="19" font-weight="800" fill="#59418f">FVAF = [(1+r)ⁿ-1]/r</text><text x="1020" y="274" text-anchor="middle" font-size="17" fill="#4f6278">정기적립액을 미래 누적액으로</text><rect x="90" y="365" width="300" height="180" rx="18" fill="#fff8ec" stroke="#e9bd72"/><text x="240" y="406" text-anchor="middle" font-size="24" font-weight="800" fill="#c97700">감채기금계수</text><text x="240" y="452" text-anchor="middle" font-size="21" font-weight="800" fill="#8f5a0b">SFF = r/[(1+r)ⁿ-1]</text><text x="240" y="496" text-anchor="middle" font-size="17" fill="#604d35">목표 미래금액 → 매기 적립액</text><rect x="450" y="365" width="300" height="180" rx="18" fill="#f5f1fb" stroke="#c9b8e4"/><text x="600" y="406" text-anchor="middle" font-size="24" font-weight="800" fill="#6e55aa">저당상수</text><text x="600" y="452" text-anchor="middle" font-size="21" font-weight="800" fill="#59418f">MC = r/[1-(1+r)⁻ⁿ]</text><text x="600" y="496" text-anchor="middle" font-size="17" fill="#604f74">융자액 → 매기 원리금상환액</text><rect x="810" y="365" width="300" height="180" rx="18" fill="#eef5ff" stroke="#b8cee8"/><text x="960" y="406" text-anchor="middle" font-size="24" font-weight="800" fill="#1b5fb8">잔금비율</text><text x="960" y="447" text-anchor="middle" font-size="18" font-weight="800" fill="#174a88">남은 PVAF ÷ 전체 PVAF</text><text x="960" y="490" text-anchor="middle" font-size="17" fill="#4f6278">대출원금 × 잔금비율 = 미상환잔금</text></g><g transform="translate(55 595)" font-family="sans-serif"><rect width="1090" height="72" rx="16" fill="#eef5ff" stroke="#b6cce7"/><text x="28" y="43" font-size="19" fill="#27445f">시험 포인트: 연금PV계수↔저당상수, 연금FV계수↔감채기금계수는 각각 역수 관계다.</text></g></svg>