<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">수요·공급 이동과 균형</title><desc id="d">수요 증가·감소와 공급 증가·감소가 균형가격과 균형량에 미치는 영향</desc><rect width="1200" height="720" rx="28" fill="#f8fafc"/><text x="600" y="64" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="800" fill="#0b2b58">수요·공급 이동과 균형</text><text x="600" y="100" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#5c6f85">곡선의 이동 → 새로운 교차점 → 가격(P)·수량(Q) 변화</text><g font-family="sans-serif"><g transform="translate(40 145)"><rect width="270" height="400" rx="18" fill="#fff" stroke="#b9cce4"/><text x="135" y="36" text-anchor="middle" font-size="24" font-weight="800" fill="#165bb6">수요 증가</text><path d="M48 330V75M48 330H230" stroke="#33465c" stroke-width="3"/><path d="M72 105L205 295" stroke="#1a5fb8" stroke-width="5"/><path d="M105 95L238 285" stroke="#5793dc" stroke-width="5" stroke-dasharray="10 8"/><path d="M78 300L205 105" stroke="#2c8b57" stroke-width="5"/><circle cx="137" cy="209" r="7" fill="#26374a"/><circle cx="157" cy="180" r="7" fill="#165bb6"/><text x="135" y="365" text-anchor="middle" font-size="22" font-weight="800" fill="#165bb6">P↑ · Q↑</text></g><g transform="translate(330 145)"><rect width="270" height="400" rx="18" fill="#fff" stroke="#b9cce4"/><text x="135" y="36" text-anchor="middle" font-size="24" font-weight="800" fill="#158e8e">수요 감소</text><path d="M48 330V75M48 330H230" stroke="#33465c" stroke-width="3"/><path d="M100 105L230 295" stroke="#1a5fb8" stroke-width="5"/><path d="M70 115L200 305" stroke="#159797" stroke-width="5" stroke-dasharray="10 8"/><path d="M78 300L205 105" stroke="#2c8b57" stroke-width="5"/><circle cx="154" cy="188" r="7" fill="#26374a"/><circle cx="135" cy="216" r="7" fill="#158e8e"/><text x="135" y="365" text-anchor="middle" font-size="22" font-weight="800" fill="#158e8e">P↓ · Q↓</text></g><g transform="translate(620 145)"><rect width="270" height="400" rx="18" fill="#fff" stroke="#b9cce4"/><text x="135" y="36" text-anchor="middle" font-size="24" font-weight="800" fill="#d77a00">공급 증가</text><path d="M48 330V75M48 330H230" stroke="#33465c" stroke-width="3"/><path d="M75 105L210 300" stroke="#1a5fb8" stroke-width="5"/><path d="M90 300L205 110" stroke="#d77a00" stroke-width="5"/><path d="M120 300L235 110" stroke="#f2a033" stroke-width="5" stroke-dasharray="10 8"/><circle cx="141" cy="216" r="7" fill="#26374a"/><circle cx="157" cy="239" r="7" fill="#d77a00"/><text x="135" y="365" text-anchor="middle" font-size="22" font-weight="800" fill="#d77a00">P↓ · Q↑</text></g><g transform="translate(910 145)"><rect width="250" height="400" rx="18" fill="#fff" stroke="#b9cce4"/><text x="125" y="36" text-anchor="middle" font-size="24" font-weight="800" fill="#6951a7">공급 감소</text><path d="M48 330V75M48 330H220" stroke="#33465c" stroke-width="3"/><path d="M70 105L205 300" stroke="#1a5fb8" stroke-width="5"/><path d="M120 300L225 120" stroke="#876cc2" stroke-width="5"/><path d="M90 300L195 120" stroke="#6951a7" stroke-width="5" stroke-dasharray="10 8"/><circle cx="150" cy="219" r="7" fill="#26374a"/><circle cx="135" cy="195" r="7" fill="#6951a7"/><text x="125" y="365" text-anchor="middle" font-size="22" font-weight="800" fill="#6951a7">P↑ · Q↓</text></g></g><g transform="translate(55 575)" font-family="sans-serif"><rect width="1090" height="90" rx="18" fill="#eef5ff" stroke="#b7cde8"/><text x="28" y="35" font-size="22" font-weight="800" fill="#0d4e9a">시험 포인트</text><text x="28" y="65" font-size="18" fill="#2f475f">‘수요량·공급량의 변화’는 같은 곡선 위 이동, ‘수요·공급의 변화’는 곡선 자체의 이동이다.</text></g></svg>